<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 98" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">论文 04 · 2026-06   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">LoopCoder-v2：在并行循环 Transformer 里，第二次循环几乎           </tspan><tspan x="64" dy="31.7">是全部——第三次开始交位置税     </tspan></text></g><g id="plt" data-pptx-bounds="64 148 523 214"><rect x="64" y="148" width="523" height="214" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">PLT 怎样把延迟和 KV 压平    </tspan></text><text x="80" y="197" font-size="12.0" fill="#E6EDF5"><tspan x="80" dy="0.0">• <tspan font-weight="bold">共享 KV + 门控滑窗注意力</tspan>：第一轮 KV 冻结共享；后续轮 = 全局分           </tspan><tspan x="80" dy="17.0">支与局部滑窗（w=64）的逐头门控混合。KV 从 O(RLSd) 降到          </tspan><tspan x="80" dy="17.0">O(LSd)   </tspan><tspan x="80" dy="24.0">• <tspan font-weight="bold">跨循环位置偏移 CLP</tspan>：B^(r) = Embed(x) + shift(h^(r−1))，上           </tspan><tspan x="80" dy="17.0">一轮状态右移一位，不同 token 的不同轮次可并行；延迟 ≈ 单次前向           </tspan><tspan x="80" dy="24.0">• <tspan font-weight="bold">代价</tspan>：token i 拿到的是邻居的状态 → 位置错配。7B，R∈{1,2,3,4}           </tspan><tspan x="80" dy="17.0">各自从头训练 18T token，同一份 SFT，共 100 万 GPU 小时          </tspan></text></g><g id="lc_table" data-pptx-bounds="603 148 613 180"><text x="608.5600000000001" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold"><tspan x="608.5600000000001" dy="0.0">7B 模型   </tspan></text><text x="780.592" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="780.592" dy="0.0">   HE+</tspan></text><text x="848.0704" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="848.0704" dy="0.0">   LCB</tspan></text><text x="927.8176" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="927.8176" dy="0.0">   SWE-V</tspan></text><text x="1025.9679999999998" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="1025.9679999999998" dy="0.0">   Multi-SWE</tspan></text><text x="1093.4463999999998" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="1093.4463999999998" dy="0.0"> TB-v2</tspan></text><text x="1148.6559999999997" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="1148.6559999999997" dy="0.0">BFCL</tspan></text><text x="1209.9999999999998" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="1209.9999999999998" dy="0.0">   均值</tspan></text><line x1="603" y1="182" x2="1216" y2="182" stroke="#4A7BA7" stroke-width="1.2" /><text x="608.5600000000001" y="203" font-size="12.5" fill="#E6EDF5"><tspan x="608.5600000000001" dy="0.0">基线 R=1   </tspan></text><text x="780.592" y="203" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="780.592" dy="0.0">   81.1</tspan></text><text x="848.0704" y="203" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="848.0704" dy="0.0">   27.4</tspan></text><text x="927.8176" y="203" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="927.8176" dy="0.0">   43.0</tspan></text><text x="1025.9679999999998" y="203" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1025.9679999999998" dy="0.0">   14.0</tspan></text><text x="1093.4463999999998" y="203" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1093.4463999999998" dy="0.0">   11.2</tspan></text><text x="1148.6559999999997" y="203" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1148.6559999999997" dy="0.0">   32.2</tspan></text><text x="1209.9999999999998" y="203" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1209.9999999999998" dy="0.0">   38.0</tspan></text><line x1="603" y1="216" x2="1216" y2="216" stroke="#4A7BA7" stroke-width="0.5" /><rect x="603" y="217" width="613" height="32" rx="3" fill="#4FC9E8" fill-opacity="0.1" /><text x="608.5600000000001" y="237" font-size="12.5" fill="#E6EDF5" font-weight="bold"><tspan x="608.5600000000001" dy="0.0">R=2   </tspan></text><text x="780.592" y="237" font-size="12.5" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="780.592" dy="0.0">   84.1</tspan></text><text x="848.0704" y="237" font-size="12.5" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="848.0704" dy="0.0">   35.4</tspan></text><text x="927.8176" y="237" font-size="12.5" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="927.8176" dy="0.0">   64.4</tspan></text><text x="1025.9679999999998" y="237" font-size="12.5" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="1025.9679999999998" dy="0.0">   31.0</tspan></text><text x="1093.4463999999998" y="237" font-size="12.5" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="1093.4463999999998" dy="0.0">   21.0</tspan></text><text x="1148.6559999999997" y="237" font-size="12.5" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="1148.6559999999997" dy="0.0">   40.1</tspan></text><text x="1209.9999999999998" y="237" font-size="12.5" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="1209.9999999999998" dy="0.0">   46.5</tspan></text><line x1="603" y1="250" x2="1216" y2="250" stroke="#4A7BA7" stroke-width="0.5" /><text x="608.5600000000001" y="271" font-size="12.5" fill="#E6EDF5"><tspan x="608.5600000000001" dy="0.0">R=3   </tspan></text><text x="780.592" y="271" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="780.592" dy="0.0">   75.0</tspan></text><text x="848.0704" y="271" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="848.0704" dy="0.0">   28.6</tspan></text><text x="927.8176" y="271" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="927.8176" dy="0.0">   27.6</tspan></text><text x="1025.9679999999998" y="271" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1025.9679999999998" dy="0.0">   11.0</tspan></text><text x="1093.4463999999998" y="271" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1093.4463999999998" dy="0.0">   12.2</tspan></text><text x="1148.6559999999997" y="271" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1148.6559999999997" dy="0.0">   36.3</tspan></text><text x="1209.9999999999998" y="271" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1209.9999999999998" dy="0.0">   36.9</tspan></text><line x1="603" y1="284" x2="1216" y2="284" stroke="#4A7BA7" stroke-width="0.5" /><text x="608.5600000000001" y="305" font-size="12.5" fill="#E6EDF5"><tspan x="608.5600000000001" dy="0.0">R=4   </tspan></text><text x="780.592" y="305" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="780.592" dy="0.0">   76.8</tspan></text><text x="848.0704" y="305" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="848.0704" dy="0.0">   24.5</tspan></text><text x="927.8176" y="305" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="927.8176" dy="0.0">   22.4</tspan></text><text x="1025.9679999999998" y="305" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1025.9679999999998" dy="0.0">   9.3</tspan></text><text x="1093.4463999999998" y="305" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1093.4463999999998" dy="0.0">   9.0</tspan></text><text x="1148.6559999999997" y="305" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1148.6559999999997" dy="0.0">   39.5</tspan></text><text x="1209.9999999999998" y="305" font-size="12.5" fill="#E6EDF5" text-anchor="end"><tspan x="1209.9999999999998" dy="0.0">   34.3</tspan></text><line x1="603" y1="318" x2="1216" y2="318" stroke="#4A7BA7" stroke-width="0.5" /></g><g id="lc_note" data-pptx-bounds="603 338 613 34"><text x="602.5600000000001" y="351" font-size="11" fill="#A9B8CB"><tspan x="602.5600000000001" dy="0.0">Table 2；SWE-V = SWE-bench Verified。R=2 的 64.4 超过 Kimi-Dev-72B（60.4）、               </tspan><tspan x="602.5600000000001" dy="14.3">Qwen3-235B-A22B（45.2），接近 Qwen3-Coder-480B（67.0）。            </tspan></text></g><g id="k1" data-pptx-bounds="64 378 373 104"><rect x="64" y="378" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="424" font-size="32" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">174.6   </tspan></text><text x="80" y="443" font-size="9.5" fill="#A9B8CB"><tspan x="80" dy="0.0">有效秩在第 2 轮达峰（172.5 → 158.2 递减）：后续循环在收          </tspan><tspan x="80" dy="12.3">窄表示子空间；更新方向震荡（cos θ &lt; 0）       </tspan></text></g><g id="k2" data-pptx-bounds="453 378 373 104"><rect x="453" y="378" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="469.3333333333333" y="424" font-size="32" fill="#E8A54F" font-weight="bold"><tspan x="469.3333333333333" dy="0.0">30–45×   </tspan></text><text x="469.3333333333333" y="443" font-size="9.5" fill="#A9B8CB"><tspan x="469.3333333333333" dy="0.0">CLP 偏移成本 Ω ≈ 常数，是第 3 轮起边际收益的 30–45 倍——          </tspan><tspan x="469.3333333333333" dy="12.3">收益递减 + 固定成本 → R=2 达峰     </tspan></text></g><g id="k3" data-pptx-bounds="843 378 373 104"><rect x="843" y="378" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="858.6666666666666" y="424" font-size="32" fill="#6FD39A" font-weight="bold"><tspan x="858.6666666666666" dy="0.0">+26.9   </tspan></text><text x="858.6666666666666" y="443" font-size="9.5" fill="#A9B8CB"><tspan x="858.6666666666666" dy="0.0">R=2 上叠加显式 CoT（Thinking）：LiveCodeBench         </tspan><tspan x="858.6666666666666" dy="12.3">35.4→62.3，CRUX +6.6，超加性     </tspan></text></g><g id="takeaway" data-pptx-bounds="64 498 1152 44"><rect x="64" y="498" width="1152" height="44" rx="4" fill="#4FC9E8" fill-opacity="0.08" /><rect x="64" y="497.52" width="3" height="44" fill="#4FC9E8" /><text x="80" y="518" font-size="12" fill="#E6EDF5"><tspan x="80" dy="0.0"><tspan font-weight="bold">适用边界：</tspan>「两次最优」是 PLT 的性质（每次 R 单独从头训练，CLP 固定税）。顺序循环的 Huginn 到 r=32 单调上升。看有效秩曲线而不是穷举训练来选循环数                           </tspan><tspan x="80" dy="16.2">。   </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">Yang et al. · 北航 / IQuest / 澜舟 / 人大 · arXiv 2606.18023           </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   10</tspan></text></g></svg>
