<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 98" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">洞察 8–10   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">循环擅长「操作」知识而非「存储」；应用扩到 agent 与具身；          </tspan><tspan x="64" dy="31.7">生产化开始、工具链没跟上    </tspan></text></g><g id="ins1" data-pptx-bounds="64 148 373 420"><rect x="64" y="148" width="373" height="420" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80.0" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80.0" dy="0.0">8 · 能力剖面   </tspan></text><text x="80.0" y="198" font-size="13" fill="#E6EDF5"><tspan x="80.0" dy="0.0">Ouro 的对照把优势归因于知识操作而非容量       </tspan><tspan x="80.0" dy="18.5">；Huginn 闭卷弱、开卷 +11.0；Frey：循环       </tspan><tspan x="80.0" dy="18.5">帮数学、记忆库帮常识，合并才超 iso-FLOP       </tspan><tspan x="80.0" dy="18.5">基线；Dual-Path 学到的门控让标点 / 符号 /       </tspan><tspan x="80.0" dy="18.5">算术 token 走「深」、功能词走「宽」。<tspan font-weight="bold">最佳</tspan>       </tspan><tspan x="80.0" dy="18.5"><tspan font-weight="bold">搭档</tspan>：检索、长上下文、MoE 专家库——把存储       </tspan><tspan x="80.0" dy="18.5">外置。   </tspan></text></g><g id="ins2" data-pptx-bounds="453 148 373 420"><rect x="453" y="148" width="373" height="420" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="469.3333333333333" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="469.3333333333333" dy="0.0">9 · 从谜题到 agent   </tspan></text><text x="469.3333333333333" y="198" font-size="13" fill="#E6EDF5"><tspan x="469.3333333333333" dy="0.0">2025 年证据集中在数独 / 迷宫 / ARC /       </tspan><tspan x="469.3333333333333" dy="18.5">GSM8K；2026 年扩到三类：软件工程 agent       </tspan><tspan x="469.3333333333333" dy="18.5">（LoopCoder-v2 SWE-V +21.4）、工具调       </tspan><tspan x="469.3333333333333" dy="18.5">用（多步有依赖的调用随深度提升；      </tspan><tspan x="469.3333333333333" dy="18.5">Nanbeige4.2-3B 以 3B 超 Qwen3.5-9B）、       </tspan><tspan x="469.3333333333333" dy="18.5">机器人（RD-VLA 0%→&gt;90%，比 token 推理       </tspan><tspan x="469.3333333333333" dy="18.5">VLA 快 80×）。共同点：一次前向内维护中间       </tspan><tspan x="469.3333333333333" dy="18.5">状态与依赖。   </tspan></text></g><g id="ins3" data-pptx-bounds="843 148 373 420"><rect x="843" y="148" width="373" height="420" rx="10" fill="#16283C" stroke="#E8A54F" stroke-width="1.2" /><text x="858.6666666666666" y="177" font-size="15" fill="#E8A54F" font-weight="bold"><tspan x="858.6666666666666" dy="0.0">10 · 工具链缺口   </tspan></text><text x="858.6666666666666" y="198" font-size="13" fill="#E6EDF5"><tspan x="858.6666666666666" dy="0.0">五个开源家族：Huginn、Ouro、     </tspan><tspan x="858.6666666666666" dy="18.5">LoopCoder-v2、Loopie、Nanbeige4.2-3B       </tspan><tspan x="858.6666666666666" dy="18.5">（28T token，已作为产品发布）。但复现报       </tspan><tspan x="858.6666666666666" dy="18.5">告显示 Nanbeige 在 HF transformers 上开       </tspan><tspan x="858.6666666666666" dy="18.5">箱 5 个 bug，修复后层复用仍使注意力内存翻       </tspan><tspan x="858.6666666666666" dy="18.5">倍。推理框架、量化、KV 管理都没有循环模       </tspan><tspan x="858.6666666666666" dy="18.5">型的标准接口；Loopie 的 megatron-loopie       </tspan><tspan x="858.6666666666666" dy="18.5">/ vllm-loopie 分支是往这个方向的信号。       </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">Ouro 2510.25741 · Frey 2603.08391 · Dual-Path 2605.30202 · Popescu 2608.18171 · RD-VLA 2602.07845 · Halloran 2608.13987                        </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   16</tspan></text></g></svg>
