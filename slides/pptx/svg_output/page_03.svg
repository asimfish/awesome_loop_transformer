<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 98" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">概念   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">什么是循环 Transformer：同一组参数在深度上重复使用，深度          </tspan><tspan x="64" dy="31.7">与参数量解耦   </tspan></text></g><g id="granularity" data-pptx-bounds="64 148 568 470"><rect x="64" y="148" width="568" height="470" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">四种循环粒度   </tspan></text><text x="80" y="199" font-size="14" fill="#E6EDF5"><tspan x="80" dy="0.0">• <tspan font-weight="bold">model-loop</tspan>（UT 2018 · Huginn 核心 · Ouro）：        </tspan><tspan x="80" dy="19.9">L1→L2→L3→L1→L2→L3，整栈输出喂回      </tspan><tspan x="80" dy="26.9">• <tspan font-weight="bold">block-loop</tspan>（Huginn 三段式 · Hyperloop · Training-Free ·           </tspan><tspan x="80" dy="19.9">SMELT）：首尾层不循环，中段重复；每步重新注入输入 e          </tspan><tspan x="80" dy="26.9">• <tspan font-weight="bold">layer-loop</tspan>（Loopie · Training-Free layer-mode ·         </tspan><tspan x="80" dy="19.9">MixerLoop）：L1→L1→L2→L2→L3→L3，每层先局部迭代再下传           </tspan><tspan x="80" dy="26.9">• <tspan font-weight="bold">潜变量条件化</tspan>（Coconut · PLT 的 CLP · Latent Recurrent          </tspan><tspan x="80" dy="19.9">Transformer）：上一轮或上一 token 的隐状态作为条件注入；          </tspan><tspan x="80" dy="19.9">PLT 的 CLP 正是「两次饱和」的来源      </tspan></text></g><g id="axes" data-pptx-bounds="648 148 568 470"><rect x="648" y="148" width="568" height="470" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="664.0" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="664.0" dy="0.0">三条正交设计轴   </tspan></text><text x="664.0" y="199" font-size="14" fill="#E6EDF5"><tspan x="664.0" dy="0.0">• <tspan font-weight="bold">循环次数</tspan>：固定（Loopie、LoopCoder-v2）/ 训练随机·推理任           </tspan><tspan x="664.0" dy="19.9">选（Huginn）/ 逐 token 自适应停机（ACT、MoR、         </tspan><tspan x="664.0" dy="19.9">Think-at-Hard、RecurTrace）     </tspan><tspan x="664.0" dy="26.9">• <tspan font-weight="bold">训练方式</tspan>：从头预训练（Huginn、Ouro、Loopie）/ 改造已有           </tspan><tspan x="664.0" dy="19.9">模型（Relaxed Recursive、Retrofitted Recurrence）/ 免训练           </tspan><tspan x="664.0" dy="19.9">（Training-Free、Program-of-Layers）       </tspan><tspan x="664.0" dy="26.9">• <tspan font-weight="bold">目标把循环当什么</tspan>：截断展开的 LM（Huginn）/ 不动点（DEQ           </tspan><tspan x="664.0" dy="19.9">、STARS、Attractor）/ ODE 细化（Training-Free）/ 有监督           </tspan><tspan x="664.0" dy="19.9">潜在 CoT（LOTUS）/ 循环步 RL（RLTT、LoopRPT）         </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">粒度分类沿用微信原文与 Loopie / Training-Free 的术语          </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   3</tspan></text></g></svg>
