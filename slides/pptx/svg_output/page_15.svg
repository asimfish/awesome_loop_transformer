<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 98" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">洞察 4–7   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">ODE 流还是不动点？稳定性成了定理；推理成本被拆成三件事；          </tspan><tspan x="64" dy="31.7">循环与 CoT 互补   </tspan></text></g><g id="ins1" data-pptx-bounds="64 148 568 200"><rect x="64" y="148" width="568" height="200" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">4 · 两种哲学分化   </tspan></text><text x="80" y="198" font-size="12.5" fill="#E6EDF5"><tspan x="80" dy="0.0">Training-Free：预训练中段不是压缩映射，不动点加速器都不如 RK 子步 — —            </tspan><tspan x="80" dy="17.8">对<tspan font-weight="bold">已训练</tspan>模型顺着 ODE 流细分步长。另一支把循环<tspan font-weight="bold">训成</tspan>不动点：           </tspan><tspan x="80" dy="17.8">STARS（谱半径正则）、Fixed-Point Reasoners、Attractor Models。            </tspan><tspan x="80" dy="17.8">Viakhirev：settling 算子加深不变差；Huginn 属 non-settling，           </tspan><tspan x="80" dy="17.8">LoopCoder-v2 的 cos θ&lt;0 震荡正是其表现。       </tspan></text></g><g id="ins2" data-pptx-bounds="648 148 568 200"><rect x="648" y="148" width="568" height="200" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="664.0" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="664.0" dy="0.0">5 · 稳定性从经验到定理    </tspan></text><text x="664.0" y="198" font-size="12.5" fill="#E6EDF5"><tspan x="664.0" dy="0.0">Huginn 的两次失败（2025）到 2026 年成了定理：残差缩放 ε=1/N 而非            </tspan><tspan x="664.0" dy="17.8">1/√L；DeepNorm 指数 1/4→1/2；最优学习率只依赖唯一层数、可跨循环            </tspan><tspan x="664.0" dy="17.8">数迁移。Fully Looped 稳到 12 次，LoopMTP 到 15 次。「循环模型难训            </tspan><tspan x="664.0" dy="17.8">」这道 2018 年以来的障碍基本被拆除。      </tspan></text></g><g id="ins3" data-pptx-bounds="64 364 568 200"><rect x="64" y="364" width="568" height="200" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="393" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">6 · 推理成本拆成三个子问题    </tspan></text><text x="80" y="414" font-size="12.5" fill="#E6EDF5"><tspan x="80" dy="0.0">延迟：PLT 并行、扩散式并行采样器 5×。KV：共享（Huginn / MoR /            </tspan><tspan x="80" dy="17.8">MELT）或压缩（LLA：跨循环 KV 低秩，32× 近无损，H200 上批容量            </tspan><tspan x="80" dy="17.8">32→768）。量化：LoopQ。三者独立可叠加。<tspan font-weight="bold">口径警告</tspan>：Loopie 的算力            </tspan><tspan x="80" dy="17.8">匹配是训练步时；推理时每 token 54 次块计算 vs 48，未报延迟。           </tspan></text></g><g id="ins4" data-pptx-bounds="648 364 568 200"><rect x="648" y="364" width="568" height="200" rx="10" fill="#16283C" stroke="#4FC9E8" stroke-width="1.2" /><text x="664.0" y="393" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="664.0" dy="0.0">7 · 互补而非替代   </tspan></text><text x="664.0" y="414" font-size="12.5" fill="#E6EDF5"><tspan x="664.0" dy="0.0">LoopCoder-v2 R=2 叠加 thinking：LCB +26.9 远超各自之和；LOTUS            </tspan><tspan x="664.0" dy="17.8">用金标 CoT 监督潜在位置，3B 追平显式 CoT，思考延迟降 2.5–6.9×。配            </tspan><tspan x="664.0" dy="17.8">套发现：<tspan font-weight="bold">标准 RL 与循环模型错配</tspan>——GRPO 只给最终潜在状态分配 credit            </tspan><tspan x="664.0" dy="17.8">；RLTT 沿轨迹分配后 Ouro-2.6B 数学 +10.9%；LoopRPT 在预训练就            </tspan><tspan x="664.0" dy="17.8">给潜在步分配强化信号。    </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">STARS 2605.26733 · Think Shallow 2608.18222 · 残差缩放 2606.18524 · DeepLoop 2607.13491 · LLA 2607.15456 · RLTT 2602.10520                         </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   15</tspan></text></g></svg>
