<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 66" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">一页结论   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">三句话说清这个方向在 2026 年的位置      </tspan></text></g><g id="card1" data-pptx-bounds="64 116 373 400"><rect x="64" y="116" width="373" height="400" rx="10" fill="#16283C" stroke="#4FC9E8" stroke-width="1.2" /><text x="80.0" y="145" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80.0" dy="0.0">首胜   </tspan></text><text x="80.0" y="168" font-size="14.5" fill="#E6EDF5"><tspan x="80.0" dy="0.0"><tspan font-weight="bold">算力匹配下第一次赢。</tspan>   </tspan><tspan x="80.0" dy="20.6">Loopie-20B-A2B 在与    </tspan><tspan x="80.0" dy="20.6">Qwen3-30B-A3B 复现版相同的每步墙      </tspan><tspan x="80.0" dy="20.6">钟时间下训练 800B token，约 600B 后      </tspan><tspan x="80.0" dy="20.6">反超；SMELT 在 FLOPs / 参数 / KV      </tspan><tspan x="80.0" dy="20.6">三重匹配下省 6.8–18% 训练 FLOPs。      </tspan><tspan x="80.0" dy="27.6">胜利发生在「两步 · 逐层 · MoE」这个窄      </tspan><tspan x="80.0" dy="20.6">配置里。   </tspan></text></g><g id="card2" data-pptx-bounds="453 116 373 400"><rect x="453" y="116" width="373" height="400" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="469.3333333333333" y="145" font-size="15" fill="#E8A54F" font-weight="bold"><tspan x="469.3333333333333" dy="0.0">2 vs 32   </tspan></text><text x="469.3333333333333" y="168" font-size="14.5" fill="#E6EDF5"><tspan x="469.3333333333333" dy="0.0"><tspan font-weight="bold">「循环几次」分裂成两个 regime。</tspan> 预      </tspan><tspan x="469.3333333333333" dy="20.6">训练算力受限 → 2（Loopie、     </tspan><tspan x="469.3333333333333" dy="20.6">LoopCoder-v2、SMELT、Nanbeige）      </tspan><tspan x="469.3333333333333" dy="20.6">；推理算力可变 → 越多越好但要自适应（      </tspan><tspan x="469.3333333333333" dy="20.6">Huginn 到 32–64）。   </tspan><tspan x="469.3333333333333" dy="27.6">「三次以上回退」是 PLT 并行设计的位      </tspan><tspan x="469.3333333333333" dy="20.6">置税，不是循环的普适上限。    </tspan></text></g><g id="card3" data-pptx-bounds="843 116 373 400"><rect x="843" y="116" width="373" height="400" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="858.6666666666666" y="145" font-size="15" fill="#6FD39A" font-weight="bold"><tspan x="858.6666666666666" dy="0.0">超加   </tspan></text><text x="858.6666666666666" y="168" font-size="14.5" fill="#E6EDF5"><tspan x="858.6666666666666" dy="0.0"><tspan font-weight="bold">隐式循环 + 显式 CoT 互补。</tspan>     </tspan><tspan x="858.6666666666666" dy="20.6">LoopCoder-v2 在 R=2 上叠加 thinking       </tspan><tspan x="858.6666666666666" dy="20.6">模式，LiveCodeBench +26.9，远超两      </tspan><tspan x="858.6666666666666" dy="20.6">者单独之和；LOTUS 首次在 3B 规模用      </tspan><tspan x="858.6666666666666" dy="20.6">潜在 CoT 追平显式 CoT。    </tspan><tspan x="858.6666666666666" dy="27.6">标准 GRPO 与循环模型错配（RLTT、      </tspan><tspan x="858.6666666666666" dy="20.6">LoopRPT）。   </tspan></text></g><g id="takeaway" data-pptx-bounds="64 532 1152 44"><rect x="64" y="532" width="1152" height="44" rx="4" fill="#4FC9E8" fill-opacity="0.08" /><rect x="64" y="531.8" width="3" height="44" fill="#4FC9E8" /><text x="80" y="553" font-size="13" fill="#E6EDF5"><tspan x="80" dy="0.0"><tspan font-weight="bold">给工程团队的一句话：</tspan>中段循环、两次、layer-loop、MoE 骨干；部署前实测延迟和 KV cache——训练算力匹配的胜利不等于推理成本匹配的胜利。                         </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">数字来源：Loop the Loopies (2607.16051) · SMELT (2609.01343) · LoopCoder-v2 (2606.18023) · LOTUS (2606.31779)                      </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   2</tspan></text></g></svg>
