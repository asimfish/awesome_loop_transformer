<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 66" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">论文 02 · 续   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">循环在哪里最有用、白拿的能力、以及隐空间里发生了什么         </tspan></text></g><g id="c1" data-pptx-bounds="64 116 373 400"><rect x="64" y="116" width="373" height="400" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80.0" y="145" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80.0" dy="0.0">循环在哪里最有用   </tspan></text><text x="80.0" y="167" font-size="14" fill="#E6EDF5"><tspan x="80.0" dy="0.0">• 难任务（ARC-C）收益大，事实回忆（       </tspan><tspan x="80.0" dy="19.9">SciQ）收益小   </tspan><tspan x="80.0" dy="26.9">• 上下文越多需要的循环越多：ARC-C 零       </tspan><tspan x="80.0" dy="19.9">样本 8–12 次饱和，25–50 shot 需 32 次       </tspan><tspan x="80.0" dy="26.9">• 开卷 OBQA +11.0（38.2→49.2）：记的       </tspan><tspan x="80.0" dy="19.9">事实少，对上下文推理强    </tspan><tspan x="80.0" dy="26.9">• <tspan font-weight="bold">传播误差</tspan>：把 0.8T 的循环模型与      </tspan><tspan x="80.0" dy="19.9">0.18T 的基线并列成「同样 0.8T」夸大了       </tspan><tspan x="80.0" dy="19.9">差距   </tspan></text></g><g id="c2" data-pptx-bounds="453 116 373 400"><rect x="453" y="116" width="373" height="400" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="469.3333333333333" y="145" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="469.3333333333333" dy="0.0">零样本免费能力   </tspan></text><text x="469.3333333333333" y="167" font-size="14" fill="#E6EDF5"><tspan x="469.3333333333333" dy="0.0">• 逐 token 自适应停机（KL &lt; 5e-4）：      </tspan><tspan x="469.3333333333333" dy="19.9">MT-Bench 5.63→5.56   </tspan><tspan x="469.3333333333333" dy="26.9">• KV cache 共享（预算 4）：不掉分      </tspan><tspan x="469.3333333333333" dy="26.9">• 连续 CoT：用上一 token 的 s_r 热启动       </tspan><tspan x="469.3333333333333" dy="19.9">，少走 1–2 步   </tspan><tspan x="469.3333333333333" dy="26.9">• 自推测解码：少循环起草、多循环验证，       </tspan><tspan x="469.3333333333333" dy="19.9">无需 draft 模型   </tspan></text></g><g id="c3" data-pptx-bounds="843 116 373 400"><rect x="843" y="116" width="373" height="400" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="858.6666666666666" y="145" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="858.6666666666666" dy="0.0">隐空间里发生了什么   </tspan></text><text x="858.6666666666666" y="167" font-size="14" fill="#E6EDF5"><tspan x="858.6666666666666" dy="0.0">• 多数 token 收敛到不动点    </tspan><tspan x="858.6666666666666" dy="26.9">• 数值推理 token（GSM8K 的「3」）进      </tspan><tspan x="858.6666666666666" dy="19.9">入多维<tspan font-weight="bold">轨道</tspan>   </tspan><tspan x="858.6666666666666" dy="26.9">• 关键 token（「wrong」）表现为单向<tspan font-weight="bold">滑</tspan>       </tspan><tspan x="858.6666666666666" dy="19.9"><tspan font-weight="bold">块</tspan>，可能在计步   </tspan><tspan x="858.6666666666666" dy="26.9">• 换 s₀ 轨迹形状不变（路径独立）     </tspan><tspan x="858.6666666666666" dy="26.9">• Lu et al. 2025 用 logit lens 只发现有      </tspan><tspan x="858.6666666666666" dy="19.9">限的可解释潜在 CoT 证据    </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">Table 4 · Figure 9–12 · Section 6–7      </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   8</tspan></text></g></svg>
