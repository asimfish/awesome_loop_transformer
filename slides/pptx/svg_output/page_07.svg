<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 98" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">论文 02 · 2025-02   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">Huginn-3.5B：Prelude → Core ×r → Coda，随机采样循环次数           </tspan><tspan x="64" dy="31.7">、只对最后 8 步反传   </tspan></text></g><g id="arch" data-pptx-bounds="64 148 568 300"><rect x="64" y="148" width="568" height="300" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">架构与训练   </tspan></text><text x="80" y="198" font-size="13" fill="#E6EDF5"><tspan x="80" dy="0.0">e = P(x); s₀ ~ N(0,σ²I); sᵢ = R(e, sᵢ₋₁); p = C(s_r)          </tspan><tspan x="80" dy="25.5">• <tspan font-weight="bold">输入注入</tspan>：像梯度下降每步都要用数据；只在第一步喂 e 的迭代不可能            </tspan><tspan x="80" dy="18.5">稳定。随机 s₀ + 注入 → 路径独立。      </tspan><tspan x="80" dy="25.5">• <tspan font-weight="bold">训练目标</tspan>：r ~ 对数正态泊松（均值 32，重尾）；<tspan font-weight="bold">只对最后 k=8 步反</tspan>            </tspan><tspan x="80" dy="18.5"><tspan font-weight="bold">传</tspan>，内存与 r 无关。   </tspan><tspan x="80" dy="25.5">• <tspan font-weight="bold">规模</tspan>：h=5280，(2,4,2)，3.5B 参数；r=32 时有效深度 132 层。           </tspan><tspan x="80" dy="18.5">800B token，4096 块 MI250X，恒定学习率 4e-5，三明治归一化。           </tspan><tspan x="80" dy="25.5">• <tspan font-weight="bold">两次失败</tspan>：隐状态坍缩（token 间相关度→1）；循环坍缩（r=1 与           </tspan><tspan x="80" dy="18.5">r=32 困惑度相同）。   </tspan></text></g><g id="huginn_table" data-pptx-bounds="648 148 568 180"><text x="654.0" y="165" font-size="13" fill="#4FC9E8" font-weight="bold"><tspan x="654.0" dy="0.0">循环 r   </tspan></text><text x="806.72" y="165" font-size="13" 