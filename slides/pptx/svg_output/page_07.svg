hor="end"><tspan x="1210.0" dy="0.0">   34.80 / 42.08</tspan></text><line x1="648" y1="318" x2="1216" y2="318" stroke="#4A7BA7" stroke-width="0.5" /></g><g id="kpi_flops" data-pptx-bounds="648 338 568 110"><rect x="648" y="338" width="568" height="110" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="664.0" y="384" font-size="32" fill="#4FC9E8" font-weight="bold"><tspan x="664.0" dy="0.0">32B / 50B   </tspan></text><text x="664.0" y="404" font-size="10.5" fill="#A9B8CB"><tspan x="664.0" dy="0.0">「3.5B 打出 50B」是 FLOPs 等效：预训练每 token 原始 FLOPs 接近 32B 稠密模型，               </tspan><tspan x="664.0" dy="13.7">测试时可扩到 ~50B 的等效算力；基准分数接近 OLMo-7B、落后 OLMo-2。             </tspan></text></g><g id="takeaway" data-pptx-bounds="64 464 1152 52"><rect x="64" y="464" width="1152" height="52" rx="4" fill="#4FC9E8" fill-opacity="0.08" /><rect x="64" y="463.52" width="3" height="52" fill="#4FC9E8" /><text x="80" y="486" font-size="14" fill="#E6EDF5"><tspan x="80" dy="0.0"><tspan font-weight="bold">公平对照只有 0.18T token（Table 4）：</tspan>同为 0.18T，循环模型 ARC-E 53.62 vs 46.42、GSM8K CoT 10.24 vs 2.20；后 620B                      </tspan><tspan x="80" dy="18.9">token 学到的能力全部编码在循环里（r=1 成绩几乎不动）。          </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">Geiping, McLeish, Jain, Kirchenbauer, Singh, Bartoldson, Kailkhura, Bhatele, Goldstein · arXiv 2502.05171                    </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   7</tspan></text></g></svg>
