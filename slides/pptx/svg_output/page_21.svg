<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 66" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">给从业者   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">三种预算下的可执行配方    </tspan></text></g><g id="rec1" data-pptx-bounds="64 116 373 400"><rect x="64" y="116" width="373" height="400" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80.0" y="145" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80.0" dy="0.0">零训练：已有模型   </tspan></text><text x="80.0" y="167" font-size="14" fill="#E6EDF5"><tspan x="80.0" dy="0.0">• 中间 4 层窗口，3 级 RK 子步，β 取中间       </tspan><tspan x="80.0" dy="19.9">值   </tspan><tspan x="80.0" dy="26.9">• 稠密 block-mode，MoE layer-mode（       </tspan><tspan x="80.0" dy="19.9">先固定路由）   </tspan><tspan x="80.0" dy="26.9">• 先在知识型多选题上验证；预期 +1–2.6       </tspan><tspan x="80.0" dy="19.9">pp，多 15–30% 延迟   </tspan><tspan x="80.0" dy="26.9">• 任何「某段层跑两遍」的实验都用阻尼更       </tspan><tspan x="80.0" dy="19.9">新 x←(1−1/K)x+(1/K)g(x)     </tspan></text></g><g id="rec2" data-pptx-bounds="453 116 373 400"><rect x="453" y="116" width="373" height="400" rx="10" fill="#16283C" stroke="#4FC9E8" stroke-width="1.2" /><text x="469.3333333333333" y="145" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="469.3333333333333" dy="0.0">从头预训练：前沿预算   </tspan></text><text x="469.3333333333333" y="167" font-size="14" fill="#E6EDF5"><tspan x="469.3333333333333" dy="0.0">• MoE 骨干，layer-loop，R=2     </tspan><tspan x="469.3333333333333" dy="26.9">• 层数减半 → 激活内存减半 → micro-batch       </tspan><tspan x="469.3333333333333" dy="19.9">翻倍 → 用效率增益买宽度；按<tspan font-weight="bold">实测步时</tspan>匹      </tspan><tspan x="469.3333333333333" dy="19.9">配算力   </tspan><tspan x="469.3333333333333" dy="26.9">• SmallInit / 三明治归一化 / 残差 1/N       </tspan><tspan x="469.3333333333333" dy="19.9">缩放；检查 r=1 与 r=max 的困惑度是否分       </tspan><tspan x="469.3333333333333" dy="19.9">开   </tspan><tspan x="469.3333333333333" dy="26.9">• 后训练：SPT（SFT 掩码 + PT 规模）       </tspan><tspan x="469.3333333333333" dy="19.9">；RL 用轨迹级 credit（RLTT 类）      </tspan></text></g><g id="rec3" data-pptx-bounds="843 116 373 400"><rect x="843" y="116" width="373" height="400" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="858.6666666666666" y="145" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="858.6666666666666" dy="0.0">推理时可变算力   </tspan></text><text x="858.6666666666666" y="167" font-size="14" fill="#E6EDF5"><tspan x="858.6666666666666" dy="0.0">• 顺序循环（Huginn 类）+ 训练时随机 r       </tspan><tspan x="858.6666666666666" dy="19.9">+ 截断反传，推理任选 r    </tspan><tspan x="858.6666666666666" dy="26.9">• 逐 token 自适应停机（KL 阈值 / 二阶步       </tspan><tspan x="858.6666666666666" dy="19.9">长差 / 学习式停机头）   </tspan><tspan x="858.6666666666666" dy="26.9">• KV：共享预算或 LLA 低秩编码；延迟      </tspan><tspan x="858.6666666666666" dy="19.9">：扩散式并行采样   </tspan><tspan x="858.6666666666666" dy="26.9">• 给它检索 / 长上下文——循环模型的强项      </tspan><tspan x="858.6666666666666" dy="19.9">是对上下文推理   </tspan></text></g><g id="takeaway" data-pptx-bounds="64 532 1152 44"><rect x="64" y="532" width="1152" height="44" rx="4" fill="#4FC9E8" fill-opacity="0.08" /><rect x="64" y="531.8" width="3" height="44" fill="#4FC9E8" /><text x="80" y="554" font-size="14" fill="#E6EDF5"><tspan x="80" dy="0.0"><tspan font-weight="bold">部署前必做：</tspan>实测延迟与 KV 峰值内存；不要把「训练算力匹配」当作「推理成本匹配」。               </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   21</tspan></text></g></svg>
