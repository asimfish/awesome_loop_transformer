<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 98" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">九月以来的变化 · 2026-11-06 更新      </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">九月以来的六个变化（2026-09 – 11）：两次循环不是规律，安          </tspan><tspan x="64" dy="31.7">全成了新维度   </tspan></text></g><g id="changes" data-pptx-bounds="64 148 1152 346"><text x="70" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold"><tspan x="70" dy="0.0">#   </tspan></text><text x="116.08" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold"><tspan x="116.08" dy="0.0">变化   </tspan></text><text x="553.84" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold"><tspan x="553.84" dy="0.0">关键数字（条件）   </tspan></text><text x="922.48" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold"><tspan x="922.48" dy="0.0">来源 arXiv   </tspan></text><text x="1037.68" y="164" font-size="12.5" fill="#4FC9E8" font-weight="bold"><tspan x="1037.68" dy="0.0">对应洞察   </tspan></text><line x1="64" y1="196" x2="1216" y2="196" stroke="#4A7BA7" stroke-width="1.2" /><text x="70" y="224" font-size="12.5" fill="#E6EDF5"><tspan x="70" dy="0.0">1   </tspan></text><text x="116.08" y="224" font-size="12.5" fill="#E6EDF5" font-weight="bold"><tspan x="116.08" dy="0.0">从头训练不靠 MoE 也胜过匹配基线；事后加循环收益不稳定          </tspan></text><text x="553.84" y="209" font-size="12.5" fill="#E6EDF5"><tspan x="553.84" dy="0.0">Loopback 用标准 Transformer <tspan font-weight="bold">40–75%</tspan> 的       </tspan><tspan x="553.84" dy="15.0">Transformer 参数达到更低 loss（token 数与执        </tspan><tspan x="553.84" dy="15.0">行深度相同）   </tspan></text><text x="922.48" y="224" font-size="12.5" fill="#E6EDF5"><tspan x="922.48" dy="0.0">2611.07226   </tspan></text><text x="1037.68" y="224" font-size="12.5" fill="#4FC9E8"><tspan x="1037.68" dy="0.0">细化洞察 1   </tspan></text><line x1="64" y1="244" x2="1216" y2="244" stroke="#4A7BA7" stroke-width="0.5" /><rect x="64" y="245" width="1152" height="46" rx="3" fill="#4FC9E8" fill-opacity="0.1" /><text x="70" y="272" font-size="12.5" fill="#E6EDF5"><tspan x="70" dy="0.0">2   </tspan></text><text x="116.08" y="264" font-size="12.5" fill="#E6EDF5" font-weight="bold"><tspan x="116.08" dy="0.0">「两次」是现有设计的最优点而非规律；自适应停机节省被         </tspan><tspan x="116.08" dy="15.0">高估   </tspan></text><text x="553.84" y="272" font-size="12.5" fill="#E6EDF5"><tspan x="553.84" dy="0.0">LOOM 700M 在近似等 FLOPs 下 <tspan font-weight="bold">5 次</tspan>循环最好        </tspan></text><text x="922.48" y="272" font-size="12.5" fill="#E6EDF5"><tspan x="922.48" dy="0.0">2610.01153   </tspan></text><text x="1037.68" y="272" font-size="12.5" fill="#E8A54F"><tspan x="1037.68" dy="0.0">修正洞察 2   </tspan></text><line x1="64" y1="292" x2="1216" y2="292" stroke="#4A7BA7" stroke-width="0.5" /><rect x="64" y="293" width="1152" height="46" rx="3" fill="#4FC9E8" fill-opacity="0.1" /><text x="70" y="320" font-size="12.5" fill="#E6EDF5"><tspan x="70" dy="0.0">3   </tspan></text><text x="116.08" y="320" font-size="12.5" fill="#E6EDF5" font-weight="bold"><tspan x="116.08" dy="0.0">推理部署成为最大技术方向，循环模型进入生产推理引擎         </tspan></text><text x="553.84" y="312" font-size="12.5" fill="#E6EDF5"><tspan x="553.84" dy="0.0">LoopVQ 在 SGLang 中把 Ouro 的服务吞吐最多        </tspan><tspan x="553.84" dy="15.0">提高到 <tspan font-weight="bold">6.1 倍</tspan>   </tspan></text><text x="922.48" y="320" font-size="12.5" fill="#E6EDF5"><tspan x="922.48" dy="0.0">2611.05304   </tspan></text><text x="1037.68" y="312" font-size="12.5" fill="#E8A54F"><tspan x="1037.68" dy="0.0">修正洞察 10 工具链；   </tspan><tspan x="1037.68" dy="15.0">细化洞察 6   </tspan></text><line x1="64" y1="340" x2="1216" y2="340" stroke="#4A7BA7" stroke-width="0.5" /><text x="70" y="368" font-size="12.5" fill="#E6EDF5"><tspan x="70" dy="0.0">4   </tspan></text><text x="116.08" y="368" font-size="12.5" fill="#E6EDF5" font-weight="bold"><tspan x="116.08" dy="0.0">循环深度会改变安全行为——十条洞察都没有覆盖的维度         </tspan></text><text x="553.84" y="360" font-size="12.5" fill="#E6EDF5"><tspan x="553.84" dy="0.0">Ouro-1.4B-Thinking 半深度下保留 89% 的       </tspan><tspan x="553.84" dy="15.0">GSM8K 准确率，协助有害请求的比例升到 <tspan font-weight="bold">5.3 倍</tspan>        </tspan></text><text x="922.48" y="368" font-size="12.5" fill="#E6EDF5"><tspan x="922.48" dy="0.0">2610.15218   </tspan></text><text x="1037.68" y="368" font-size="12.5" fill="#E8A54F"><tspan x="1037.68" dy="0.0">新维度；牵涉洞察 7   </tspan></text><line x1="64" y1="388" x2="1216" y2="388" stroke="#4A7BA7" stroke-width="0.5" /><text x="70" y="416" font-size="12.5" fill="#E6EDF5"><tspan x="70" dy="0.0">5   </tspan></text><text x="116.08" y="408" font-size="12.5" fill="#E6EDF5" font-weight="bold"><tspan x="116.08" dy="0.0">「操作知识、不存储知识」落到架构：循环内加记忆或状态         </tspan><tspan x="116.08" dy="15.0">通道   </tspan></text><text x="553.84" y="408" font-size="12.5" fill="#E6EDF5"><tspan x="553.84" dy="0.0">合成编辑实验的事实编辑传播率：有可寻址记忆        </tspan><tspan x="553.84" dy="15.0"><tspan font-weight="bold">0.71–0.96</tspan>，只靠循环 0.04–0.30     </tspan></text><text x="922.48" y="416" font-size="12.5" fill="#E6EDF5"><tspan x="922.48" dy="0.0">2606.20737   </tspan></text><text x="1037.68" y="416" font-size="12.5" fill="#4FC9E8"><tspan x="1037.68" dy="0.0">支持洞察 8   </tspan></text><line x1="64" y1="436" x2="1216" y2="436" stroke="#4A7BA7" stroke-width="0.5" /><text x="70" y="464" font-size="12.5" fill="#E6EDF5"><tspan x="70" dy="0.0">6   </tspan></text><text x="116.08" y="464" font-size="12.5" fill="#E6EDF5" font-weight="bold"><tspan x="116.08" dy="0.0">应用扩展到生成式和科学基础模型     </tspan></text><text x="553.84" y="456" font-size="12.5" fill="#E6EDF5"><tspan x="553.84" dy="0.0">260M 的 Looped-DiT 以 <tspan font-weight="bold">1/4.9</tspan> 的推理算力超过        </tspan><tspan x="553.84" dy="15.0">大 6.5 倍的文生图模型   </tspan></text><text x="922.48" y="464" font-size="12.5" fill="#E6EDF5"><tspan x="922.48" dy="0.0">2609.40305   </tspan></text><text x="1037.68" y="464" font-size="12.5" fill="#4FC9E8"><tspan x="1037.68" dy="0.0">扩展洞察 9   </tspan></text><line x1="64" y1="484" x2="1216" y2="484" stroke="#4A7BA7" stroke-width="0.5" /></g><g id="k1" data-pptx-bounds="64 500 373 104"><rect x="64" y="500" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="546" font-size="32" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">211   </tspan></text><text x="80" y="565" font-size="9.5" fill="#A9B8CB"><tspan x="80" dy="0.0">2026-11-06 新增：167 篇首版提交于 2026-09-01 至         </tspan><tspan x="80" dy="12.3">11-06；44 篇是首轮检索漏掉的 6–8 月论文       </tspan></text></g><g id="k2" data-pptx-bounds="453 500 373 104"><rect x="453" y="500" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="469.3333333333333" y="546" font-size="32" fill="#4FC9E8" font-weight="bold"><tspan x="469.3333333333333" dy="0.0">26 / 167   </tspan></text><text x="469.3333333333333" y="565" font-size="9.5" fill="#A9B8CB"><tspan x="469.3333333333333" dy="0.0">167 篇新论文中 26 篇以效率为主类：推理部署是最大的技术方          </tspan><tspan x="469.3333333333333" dy="12.3">向（变化 3）   </tspan></text></g><g id="k3" data-pptx-bounds="843 500 373 104"><rect x="843" y="500" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="858.6666666666666" y="546" font-size="32" fill="#E8A54F" font-weight="bold"><tspan x="858.6666666666666" dy="0.0">0.8B   </tspan></text><text x="858.6666666666666" y="565" font-size="9.5" fill="#A9B8CB"><tspan x="858.6666666666666" dy="0.0">事后给已训练的 Qwen3/Qwen3.5 加循环，只在 0.8B 上胜过等          </tspan><tspan x="858.6666666666666" dy="12.3">参数和等 FLOPs 基线（2610.42030）      </tspan></text></g><g id="takeaway" data-pptx-bounds="64 616 1152 44"><rect x="64" y="616" width="1152" height="44" rx="4" fill="#4FC9E8" fill-opacity="0.08" /><rect x="64" y="615.52" width="3" height="44" fill="#4FC9E8" /><text x="80" y="636" font-size="12" fill="#E6EDF5"><tspan x="80" dy="0.0"><tspan font-weight="bold">怎么读：</tspan>洞察 2 和洞察 10 的工具链部分被修正，洞察 1、6 被细化，洞察 8、9 得到支持和扩展；后训练（洞察 7）需要覆盖模型可能运行的每个深度。                         </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">数字均出自所引论文的摘要 · 全文：README_zh「九月以来的变化」· README「What changed since September 2026」                     </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   17</tspan></text></g></svg>
