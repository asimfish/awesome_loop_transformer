-A3B   </tspan></text><text x="792.5920000000001" y="328" font-size="12" fill="#E6EDF5"><tspan x="792.5920000000001" dy="0.0">OpenBookQA   </tspan></text><text x="1044.3712" y="328" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1044.3712" dy="0.0">   31.60</tspan></text><text x="1136.3872000000001" y="328" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1136.3872000000001" dy="0.0">   32.80</tspan></text><text x="1210.0" y="328" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1210.0" dy="0.0">   +1.20</tspan></text><line x1="603" y1="340" x2="1216" y2="340" stroke="#4A7BA7" stroke-width="0.5" /><text x="608.5600000000001" y="360" font-size="12" fill="#E6EDF5"><tspan x="608.5600000000001" dy="0.0">DeepSeek-V2-Lite-Chat   </tspan></text><text x="792.5920000000001" y="360" font-size="12" fill="#E6EDF5"><tspan x="792.5920000000001" dy="0.0">ARC-Challenge   </tspan></text><text x="1044.3712" y="360" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1044.3712" dy="0.0">   57.94</tspan></text><text x="1136.3872000000001" y="360" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1136.3872000000001" dy="0.0">   58.79</tspan></text><text x="1210.0" y="360" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1210.0" dy="0.0">   +0.85</tspan></text><line x1="603" y1="372" x2="1216" y2="372" stroke="#4A7BA7" stroke-width="0.5" /><text x="608.5600000000001" y="392" font-size="12" fill="#E6EDF5"><tspan x="608.5600000000001" dy="0.0">Qwen3-30B-A3B（事先    </tspan><tspan x="608.5600000000001" dy="14.4">锁定）   </tspan></text><text x="792.5920000000001" y="392" font-size="12" fill="#E6EDF5"><tspan x="792.5920000000001" dy="0.0">CSQA / MMLU-flex   </tspan></text><text x="1044.3712" y="392" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1044.3712" dy="0.0">   78.71 /</tspan><tspan x="1044.3712" dy="14.4">   66.67</tspan></text><text x="1136.3872000000001" y="392" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1136.3872000000001" dy="0.0">   79.85 /</tspan><tspan x="1136.3872000000001" dy="14.4">   67.46</tspan></text><text x="1210.0" y="392" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1210.0" dy="0.0"> +1.14 /</tspan><tspan x="1210.0" dy="14.4">   +0.79</tspan></text><line x1="603" y1="404" x2="1216" y2="404" stroke="#4A7BA7" stroke-width="0.5" /></g><g id="k1" data-pptx-bounds="64 464 373 104"><rect x="64" y="464" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="510" font-size="32" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">87%   </tspan></text><text x="80" y="529" font-size="9.5" fill="#A9B8CB"><tspan x="80" dy="0.0">45 个（模型，基准）格子非负；60% 正、27% 中性；配方：中          </tspan><tspan x="80" dy="12.3">间 4 层、3 级 RK、稠密 block / MoE layer，零调参         </tspan></text></g><g id="k2" data-pptx-bounds="453 464 373 104"><rect x="453" y="464" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="469.3333333333333" y="510" font-size="32" fill="#E8A54F" font-weight="bold"><tspan x="469.3333333333333" dy="0.0">−27.7   </tspan></text><text x="469.3333333333333" y="529" font-size="9.5" fill="#A9B8CB"><tspan x="469.3333333333333" dy="0.0">循环整个模型（28 层）掉 27.73 点；n=4 +0.55，n≥6 悬崖；          </tspan><tspan x="469.3333333333333" dy="12.3">朴素循环 K=6 掉 17.71    </tspan></text></g><g id="k3" data-pptx-bounds="843 464 373 104"><rect x="843" y="464" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="858.6666666666666" y="510" font-size="32" fill="#4FC9E8" font-weight="bold"><tspan x="858.6666666666666" dy="0.0">0.5   </tspan></text><text x="858.6666666666666" y="529" font-size="9.5" fill="#A9B8CB"><tspan x="858.6666666666666" dy="0.0">最优窗口相对深度 0.43–0.71（&gt;1.7B）；小模型前移到         </tspan><tspan x="858.6666666666666" dy="12.3">0.25–0.56；MoE 必须 layer-mode（routing thrash）         </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x=