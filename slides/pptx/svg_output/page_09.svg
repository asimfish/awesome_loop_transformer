<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 98" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">论文 03 · 2026-05   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">Training-Free Looped Transformers：一层是 ODE 的一步欧           </tspan><tspan x="64" dy="31.7">拉，正确的循环是细分步长而不是走到 t=K       </tspan></text></g><g id="insight" data-pptx-bounds="64 148 523 300"><rect x="64" y="148" width="523" height="300" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">关键洞察   </tspan></text><text x="80" y="198" font-size="13" fill="#E6EDF5"><tspan x="80" dy="0.0">pre-norm 层 L(x)=x+F(x) ⇔ ẋ=F(x) 上 h=1 的前向欧拉；          </tspan><tspan x="80" dy="18.5">post-loop 层是在 x(t=1) 的近似上训练的。       </tspan><tspan x="80" dy="25.5">• <tspan font-weight="bold">朴素循环</tspan> x←g(x) 做 K 次 = 积分到 t=K，后段层没见过 → 掉点          </tspan><tspan x="80" dy="18.5">（2 维小网络：K=8 时 MSE 335）      </tspan><tspan x="80" dy="25.5">• <tspan font-weight="bold">子步</tspan> x←(1−1/K)x+(1/K)g(x)：以 O(1/K) 逼近同一个          </tspan><tspan x="80" dy="18.5">x(t=1)；K=8 时 MSE 1.04    </tspan><tspan x="80" dy="25.5">• <tspan font-weight="bold">特殊 RK 表</tspan>：输出 = β·g(x₀) + (1−β)·F^K(x₀)，β 是锚点权          </tspan><tspan x="80" dy="18.5">重   </tspan><tspan x="80" dy="25.5">• Anderson / heavy-ball / Aitken 都不如 RK 子步 → 预训练中           </tspan><tspan x="80" dy="18.5">段<tspan font-weight="bold">不是压缩映射</tspan>，是 ODE 流    </tspan></text></g><g id="tf_table" data-pptx-bounds="603 148 613 266"><text x="608.5600000000001" y="164" font-size="12" fill="#4FC9E8" font-weight="bold"><tspan x="608.5600000000001" dy="0.0">模型   </tspan></text><text x="792.5920000000001" y="164" font-size="12" fill="#4FC9E8" font-weight="bold"><tspan x="792.5920000000001" dy="0.0">基准   </tspan></text><text x="1044.3712" y="164" font-size="12" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="1044.3712" dy="0.0">   基线</tspan></text><text x="1136.3872000000001" y="164" font-size="12" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="1136.3872000000001" dy="0.0">   循环</tspan></text><text x="1210.0" y="164" font-size="12" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="1210.0" dy="0.0">   Δ pp</tspan></text><line x1="603" y1="180" x2="1216" y2="180" stroke="#4A7BA7" stroke-width="1.2" /><rect x="603" y="181" width="613" height="30" rx="3" fill="#4FC9E8" fill-opacity="0.1" /><text x="608.5600000000001" y="200" font-size="12" fill="#E6EDF5"><tspan x="608.5600000000001" dy="0.0">Qwen3-4B-Instruct   </tspan></text><text x="792.5920000000001" y="200" font-size="12" fill="#E6EDF5"><tspan x="792.5920000000001" dy="0.0">MMLU-Pro 5-shot   </tspan></text><text x="1044.3712" y="200" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1044.3712" dy="0.0">   57.14</tspan></text><text x="1136.3872000000001" y="200" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1136.3872000000001" dy="0.0">   59.79</tspan></text><text x="1210.0" y="200" font-size="12" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="1210.0" dy="0.0">   +2.64</tspan></text><line x1="603" y1="212" x2="1216" y2="212" stroke="#4A7BA7" stroke-width="0.5" /><text x="608.5600000000001" y="232" font-size="12" fill="#E6EDF5" /><text x="792.5920000000001" y="232" font-size="12" fill="#E6EDF5"><tspan x="792.5920000000001" dy="0.0">GPQA-Main 0-shot   </tspan></text><text x="1044.3712" y="232" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1044.3712" dy="0.0">   33.71</tspan></text><text x="1136.3872000000001" y="232" font-size="12" fill="#E6EDF5" text-anchor="end"><tspan x="1136.3872000000001" dy="0.0">   35.71</tspan></text><text x="1210.