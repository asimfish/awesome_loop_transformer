<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 98" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">论文 05 · 2026-07   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">Loop the Loopies!：layer-loop + 实测步时匹配 + 两次循环，          </tspan><tspan x="64" dy="31.7">循环 MoE 第一次在算力匹配下赢     </tspan></text></g><g id="recipe" data-pptx-bounds="64 148 568 260"><rect x="64" y="148" width="568" height="260" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">Loopie Recipe（按实测优化器步时匹配）       </tspan></text><text x="80" y="198" font-size="13" fill="#E6EDF5"><tspan x="80" dy="0.0">1. 参考 Qwen3-like 30B-A3B（D=2048, L=48, R=1）→ 层数减半、循            </tspan><tspan x="80" dy="18.5">环两次：种子 (2048, 24, 2)。块执行次数不变，<tspan font-weight="bold">激活内存减半</tspan>（∝           </tspan><tspan x="80" dy="18.5">s·b·D·L，随存储深度而非执行深度）      </tspan><tspan x="80" dy="25.5">2. 省下的内存换<tspan font-weight="bold">每卡 micro-batch 翻倍</tspan>（梯度累积减半，每步 token           </tspan><tspan x="80" dy="18.5">不变）   </tspan><tspan x="80" dy="25.5">3. 把效率增益再投资到宽度 / 深度，选实测步时最接近参考的候选 →           </tspan><tspan x="80" dy="18.5">Loopie-20B-A2B：D=2304，L=27，R=2，名义算力 1.42×，激活内            </tspan><tspan x="80" dy="18.5">存 0.63×   </tspan></text></g><g id="why" data-pptx-bounds="648 148 568 260"><rect x="648" y="148" width="568" height="260" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="664.0" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="664.0" dy="0.0">为什么 layer-loop、为什么只两次     </tspan></text><text x="664.0" y="198" font-size="13" fill="#E6EDF5"><tspan x="664.0" dy="0.0">• 6B-A0.6B 上 layer-loop 约 1.2T token 后反超 model-loop；消融            </tspan><tspan x="664.0" dy="18.5">去掉 layer-loop 明显更差    </tspan><tspan x="664.0" dy="25.5">• 流水线并行友好：一层的所有循环在同一 stage 内完成，无环回依赖           </tspan><tspan x="664.0" dy="25.5">• N× 循环 vs N× 存储层（250B token）：边际收益在 R=2 最大，之后            </tspan><tspan x="664.0" dy="18.5">快速衰减   </tspan><tspan x="664.0" dy="25.5">• <tspan font-weight="bold">SPT 监督预训练</tspan>：SFT 的损失掩码 + PT 的优化规模（batch ≥1024            </tspan><tspan x="664.0" dy="18.5">、序列 ≥128K、2T token、10 epoch）：预训练与推理指标同时上升，            </tspan><tspan x="664.0" dy="18.5">无过拟合、无遗忘   </tspan></text></g><g id="k1" data-pptx-bounds="64 424 373 104"><rect x="64" y="424" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="470" font-size="32" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">~600B   </tspan></text><text x="80" y="489" font-size="9.5" fill="#A9B8CB"><tspan x="80" dy="0.0">800B token 算力匹配对照，约 600B 后反超       </tspan><tspan x="80" dy="12.3">Qwen3-30B-A3B 复现版并保持领先；4 级扩展梯全胜且差距          </tspan><tspan x="80" dy="12.3">不缩小   </tspan></text></g><g id="k2" data-pptx-bounds="453 424 373 104"><rect x="453" y="424" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="469.3333333333333" y="470" font-size="32" fill="#4FC9E8" font-weight="bold"><tspan x="469.3333333333333" dy="0.0">81.28   </tspan></text><text x="469.3333333333333" y="489" font-size="9.5" fill="#A9B8CB"><tspan x="469.3333333333333" dy="0.0">20B-A2B Thinking MMLU（3.5T token）vs Nemotron 3          </tspan><tspan x="469.3333333333333" dy="12.3">Nano 80.52、Cascade 2 81.22（各 25T）；AIME24 92.09          </tspan></text></g><g id="k3" data-pptx-bounds="843 424 373 104"><rect x="843" y="424" width="373" height="104" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="858.6666666666666" y="470" font-size="32" fill="#6FD39A" font-weight="bold"><tspan x="858.6666666666666" dy="0.0">80.42   </tspan></text><text x="858.6666666666666" y="489" font-size="9.5" fill="#A9B8CB"><tspan x="858.6666666666666" dy="0.0">6B-A0.6B Thinking 的 AIME24（Ouro 2.6B：62.50）；          </tspan><tspan x="858.6666666666666" dy="12.3">AIME25 70.83；MATH-500 93.80      </tspan></text></g><g id="takeaway" data-pptx-bounds="64 544 1152 44"><rect x="64" y="544" width="1152" height="44" rx="4" fill="#4FC9E8" fill-opacity="0.08" /><rect x="64" y="543.52" width="3" height="44" fill="#4FC9E8" /><text x="80" y="566" font-size="14" fill="#E6EDF5"><tspan x="80" dy="0.0"><tspan font-weight="bold">口径：</tspan>名义 FLOPs 高 42%，但 MBS 2 vs 1 使每步墙钟时间持平——这是实测训练成本相等，不是 FLOPs 相等；推理成本未报告。                      </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">Gao, Chen, Xiao, Yang, Tao, Zhou, Dai · IQuest Research · arXiv 2607.16051              </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   11</tspan></text></g></svg>
