<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 98" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">论文 01 · 2018   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">Universal Transformers：把 N 层换成同一层重复 T 次，再让          </tspan><tspan x="64" dy="31.7">每个位置自己决定想多久    </tspan></text></g><g id="mech" data-pptx-bounds="64 148 704 250"><rect x="64" y="148" width="704" height="250" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80" dy="0.0">机制   </tspan></text><text x="80" y="199" font-size="14" fill="#E6EDF5"><tspan x="80" dy="0.0">每个时间步 t 对所有位置并行：自注意力交换信息 → 位置无关的转移函数（FFN 或              </tspan><tspan x="80" dy="19.9">深度可分离卷积）。参数跨时间步共享；坐标嵌入 P^t = 位置正弦 + 时间步正弦，每              </tspan><tspan x="80" dy="19.9">步重新加入。ACT 停机：每位置预测停机概率，累计过阈值即冻结状态。            </tspan><tspan x="80" dy="26.9"><tspan font-weight="bold">留下的三个问题</tspan>：参数—计算比（翻译只 +0.9 BLEU）；训练不稳定；推理成本无讨              </tspan><tspan x="80" dy="19.9">论。   </tspan></text></g><g id="kpi_act" data-pptx-bounds="784 148 432 250"><rect x="784" y="148" width="432" height="250" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="800.32" y="194" font-size="32" fill="#4FC9E8" font-weight="bold"><tspan x="800.32" dy="0.0">2.3 → 3.8   </tspan></text><text x="800.32" y="216" font-size="12.5" fill="#A9B8CB"><tspan x="800.32" dy="0.0">bAbI 中需要 1 / 2 / 3 条支撑事实的问题，ACT 平均         </tspan><tspan x="800.32" dy="16.2">步数 2.3 / 3.1 / 3.8：模型按需分配计算。干扰名词越         </tspan><tspan x="800.32" dy="16.2">多、优势越大——这个模式七年后在 Huginn 上原样重现         </tspan><tspan x="800.32" dy="16.2">。   </tspan></text></g><g id="ut_table" data-pptx-bounds="64 414 1152 170"><text x="70" y="431" font-size="13" fill="#4FC9E8" font-weight="bold"><tspan x="70" dy="0.0">任务   </tspan></text><text x="795.2800000000001" y="431" font-size="13" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="795.2800000000001" dy="0.0">   Transformer</tspan></text><text x="1002.6400000000001" y="431" font-size="13" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="1002.6400000000001" dy="0.0">   UT</tspan></text><text x="1210.0" y="431" font-size="13" fill="#4FC9E8" font-weight="bold" text-anchor="end"><tspan x="1210.0" dy="0.0">   UT + 动态停机</tspan></text><line x1="64" y1="446" x2="1216" y2="446" stroke="#4A7BA7" stroke-width="1.2" /><text x="70" y="466" font-size="13" fill="#E6EDF5"><tspan x="70" dy="0.0">bAbI 10K 联合训练（错误率 / 失败任务）       </tspan></text><text x="795.2800000000001" y="466" font-size="13" fill="#E6EDF5" text-anchor="end"><tspan x="795.2800000000001" dy="0.0">   22.1 (12/20)</tspan></text><text x="1002.6400000000001" y="466" font-size="13" fill="#E6EDF5" text-anchor="end"><tspan x="1002.6400000000001" dy="0.0">   0.47 (0/20)</tspan></text><text x="1210.0" y="466" font-size="13" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="1210.0" dy="0.0">   0.29 (0/20)</tspan></text><line x1="64" y1="478" x2="1216" y2="478" stroke="#4A7BA7" stroke-width="0.5" /><text x="70" y="498" font-size="13" fill="#E6EDF5"><tspan x="70" dy="0.0">LAMBADA LM 测试困惑度    </tspan></text><text x="795.2800000000001" y="498" font-size="13" fill="#E6EDF5" text-anchor="end"><tspan x="795.2800000000001" dy="0.0">   7321</tspan></text><text x="1002.6400000000001" y="498" font-size="13" fill="#E6EDF5" text-anchor="end"><tspan x="1002.6400000000001" dy="0.0">   319</tspan></text><text x="1210.0" y="498" font-size="13" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="1210.0" dy="0.0">   142</tspan></text><line x1="64" y1="510" x2="1216" y2="510" stroke="#4A7BA7" stroke-width="0.5" /><text x="70" y="530" font-size="13" fill="#E6EDF5"><tspan x="70" dy="0.0">WMT14 En-De BLEU（base）     </tspan></text><text x="795.2800000000001" y="530" font-size="13" fill="#E6EDF5" text-anchor="end"><tspan x="795.2800000000001" dy="0.0">   28.0</tspan></text><text x="1002.6400000000001" y="530" font-size="13" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="1002.6400000000001" dy="0.0">   28.9</tspan></text><text x="1210.0" y="530" font-size="13" fill="#E6EDF5" text-anchor="end"><tspan x="1210.0" dy="0.0">   –</tspan></text><line x1="64" y1="542" x2="1216" y2="542" stroke="#4A7BA7" stroke-width="0.5" /><text x="70" y="562" font-size="13" fill="#E6EDF5"><tspan x="70" dy="0.0">Copy / Reverse / Addition 字符准确率（训 40 测 400）          </tspan></text><text x="795.2800000000001" y="562" font-size="13" fill="#E6EDF5" text-anchor="end"><tspan x="795.2800000000001" dy="0.0">   .53 / .13 / .07</tspan></text><text x="1002.6400000000001" y="562" font-size="13" fill="#E6EDF5" font-weight="bold" text-anchor="end"><tspan x="1002.6400000000001" dy="0.0">   .91 / .96 / .34</tspan></text><text x="1210.0" y="562" font-size="13" fill="#E6EDF5" text-anchor="end"><tspan x="1210.0" dy="0.0">   –</tspan></text><line x1="64" y1="574" x2="1216" y2="574" stroke="#4A7BA7" stroke-width="0.5" /></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">Dehghani, Gouws, Vinyals, Uszkoreit, Kaiser · ICLR 2019 · arXiv 1807.03819              </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   6</tspan></text></g></svg>
