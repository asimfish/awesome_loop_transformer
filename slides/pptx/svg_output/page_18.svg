<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 66" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">核对   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">五处被二次传播放大的说法，对照原文      </tspan></text></g><g id="misread" data-pptx-bounds="64 116 1152 358"><text x="70" y="133" font-size="13.5" fill="#4FC9E8" font-weight="bold"><tspan x="70" dy="0.0">常见说法   </tspan></text><text x="530.8" y="133" font-size="13.5" fill="#4FC9E8" font-weight="bold"><tspan x="530.8" dy="0.0">原文事实   </tspan></text><line x1="64" y1="174" x2="1216" y2="174" stroke="#4A7BA7" stroke-width="1.2" /><text x="70" y="208" font-size="13.5" fill="#E6EDF5"><tspan x="70" dy="0.0">Huginn「同样 0.8T token」下循环模型碾压基线        </tspan></text><text x="530.8" y="208" font-size="13.5" fill="#E6EDF5"><tspan x="530.8" dy="0.0">非循环基线只训了 0.18T；同为 0.18T 时循环模型 ARC-E 53.62 vs 46.42、GSM8K              </tspan><tspan x="530.8" dy="16.2">CoT 10.24 vs 2.20   </tspan></text><line x1="64" y1="232" x2="1216" y2="232" stroke="#4A7BA7" stroke-width="0.5" /><text x="70" y="266" font-size="13.5" fill="#E6EDF5"><tspan x="70" dy="0.0">「循环两次就够，三次以上回退」是循环 Transformer 的         </tspan><tspan x="70" dy="16.2">规律   </tspan></text><text x="530.8" y="266" font-size="13.5" fill="#E6EDF5"><tspan x="530.8" dy="0.0">是 PLT（跨循环位置偏移）特有的现象；每个 R 单独从头训练；Huginn 到 r=32 单调              </tspan><tspan x="530.8" dy="16.2">上升   </tspan></text><line x1="64" y1="290" x2="1216" y2="290" stroke="#4A7BA7" stroke-width="0.5" /><text x="70" y="324" font-size="13.5" fill="#E6EDF5"><tspan x="70" dy="0.0">Loopie 与 Qwen3-30B-A3B「相同算力」       </tspan></text><text x="530.8" y="324" font-size="13.5" fill="#E6EDF5"><tspan x="530.8" dy="0.0">相同<tspan font-weight="bold">实测优化器步时</tspan>；Loopie 名义 FLOPs 高 42%，推理成本未报告；对照的是 800B              </tspan><tspan x="530.8" dy="16.2">token 自复现版   </tspan></text><line x1="64" y1="348" x2="1216" y2="348" stroke="#4A7BA7" stroke-width="0.5" /><text x="70" y="382" font-size="13.5" fill="#E6EDF5"><tspan x="70" dy="0.0">Training-Free 让开源模型「变强」      </tspan></text><text x="530.8" y="382" font-size="13.5" fill="#E6EDF5"><tspan x="530.8" dy="0.0">收益约 1–2.6 个百分点，集中在知识型多选题；3B 以下蒸馏模型可能掉分；额外约              </tspan><tspan x="530.8" dy="16.2">15–30% 推理延迟   </tspan></text><line x1="64" y1="406" x2="1216" y2="406" stroke="#4A7BA7" stroke-width="0.5" /><text x="70" y="440" font-size="13.5" fill="#E6EDF5"><tspan x="70" dy="0.0">Huginn「3.5B 打出 50B 的表现」     </tspan></text><text x="530.8" y="440" font-size="13.5" fill="#E6EDF5"><tspan x="530.8" dy="0.0">FLOPs 等效，非基准等效；基准上接近 OLMo-7B、落后 OLMo-2-7B            </tspan></text><line x1="64" y1="464" x2="1216" y2="464" stroke="#4A7BA7" stroke-width="0.5" /></g><g id="takeaway" data-pptx-bounds="64 492 1152 44"><rect x="64" y="492" width="1152" height="44" rx="4" fill="#4FC9E8" fill-opacity="0.08" /><rect x="64" y="491.8" width="3" height="44" fill="#4FC9E8" /><text x="80" y="513" font-size="13" fill="#E6EDF5"><tspan x="80" dy="0.0"><tspan font-weight="bold">方法：</tspan>每条都回到原论文的表号核对（Huginn Table 4、LoopCoder-v2 Table 2、Loopie Table 1 与 §2.4、Training-Free Table 2–3）。                        </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">reports/zh 与 survey 附录 A     </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   18</tspan></text></g></svg>
