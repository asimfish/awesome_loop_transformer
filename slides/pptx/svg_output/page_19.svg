<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 66" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">推断 · 明确标注   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">关于 GPT-6 Astra：能核实的与不能核实的       </tspan></text></g><g id="unverifiable" data-pptx-bounds="64 116 409 440"><rect x="64" y="116" width="409" height="440" rx="10" fill="#16283C" stroke="#E8A54F" stroke-width="1.2" /><text x="80" y="145" font-size="15" fill="#E8A54F" font-weight="bold"><tspan x="80" dy="0.0">不能核实   </tspan></text><text x="80" y="167" font-size="14" fill="#E6EDF5"><tspan x="80" dy="0.0">Astra 用了哪种循环、循环几次、如何训练——       </tspan><tspan x="80" dy="19.9">OpenAI 发布页无架构细节，The     </tspan><tspan x="80" dy="19.9">Information 报道基于匿名信源，两份原始材料        </tspan><tspan x="80" dy="19.9">本报告作者均无法访问。    </tspan><tspan x="80" dy="26.9">以下四条全部是基于公开文献的推断。      </tspan></text></g><g id="inferences" data-pptx-bounds="489 116 727 440"><rect x="489" y="116" width="727" height="440" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="504.96" y="145" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="504.96" dy="0.0">四条推断   </tspan></text><text x="504.96" y="167" font-size="13.5" fill="#E6EDF5"><tspan x="504.96" dy="0.0">1. 若 Astra 用 recurrent depth，公开文献中最接近「前沿规模 + 算力匹配」的配方是               </tspan><tspan x="504.96" dy="19.2">Loopie / SMELT 路线：MoE、中段或逐层、循环次数很小。整模型循环 32 次的 Huginn               </tspan><tspan x="504.96" dy="19.2">路线没有前沿预算下的算力匹配证据。      </tspan><tspan x="504.96" dy="26.2">2. 「OpenAI 绕过了两次饱和」这一推测前提不成立——两次饱和是 PLT 特有；真正的瓶               </tspan><tspan x="504.96" dy="19.2">颈是推理成本，而 KV 32× 压缩、扩散式并行采样 5× 已把它压低一个量级。            </tspan><tspan x="504.96" dy="26.2">3. 报道中的「安全担忧」对应文献里的真实问题：潜在推理无可读中间 token，探测结果依               </tspan><tspan x="504.96" dy="19.2">赖层与解码方式（Lu 2025、Jacobian Lens 2026），比监督 CoT 更难。            </tspan><tspan x="504.96" dy="26.2">4. Loopie（7 月）、LLA（7 月）、SMELT（9/1）与 Astra（9 月初）密集出现：更合               </tspan><tspan x="504.96" dy="19.2">理的解读是多个团队在 2026 上半年同时把这个方向推到可用，而非某篇论文导致某个产品               </tspan><tspan x="504.96" dy="19.2">。   </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">The Information, 2026-09-02（未访问原文）· openai.com/index/gpt-6-astra（无架构细节）                </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   19</tspan></text></g></svg>
