<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 66" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">未解问题   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">七个还没有公开答案的问题    </tspan></text></g><g id="op_left" data-pptx-bounds="64 116 568 360"><rect x="64" y="116" width="568" height="360" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="80" y="144" font-size="14" fill="#E6EDF5"><tspan x="80" dy="0.0">• <tspan font-weight="bold">多循环的算力匹配。</tspan> 所有算力匹配的胜利都在 R=2；R≥4 能否          </tspan><tspan x="80" dy="19.9">赢没有公开证据   </tspan><tspan x="80" dy="26.9">• <tspan font-weight="bold">推理成本的完整账。</tspan> 训练步时、推理延迟、KV 峰值内存需同时           </tspan><tspan x="80" dy="19.9">报告；目前没有一篇三者齐全    </tspan><tspan x="80" dy="26.9">• <tspan font-weight="bold">扩展律的函数形式。</tspan> SMELT 到 54B、Schwethelm 到 ~1B；          </tspan><tspan x="80" dy="19.9">Chinchilla + r^φ 项在 100B+ 是否成立未知       </tspan><tspan x="80" dy="26.9">• <tspan font-weight="bold">自适应停机的预训练规模收益。</tspan> MoR / TaH / RecurTrace 都           </tspan><tspan x="80" dy="19.9">在 ≤8B；只有 Ouro 的熵正则深度分配在 7.7T token 验证过          </tspan></text></g><g id="op_right" data-pptx-bounds="648 116 568 360"><rect x="648" y="116" width="568" height="360" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="664.0" y="144" font-size="14" fill="#E6EDF5"><tspan x="664.0" dy="0.0">• <tspan font-weight="bold">潜在推理的可监督性。</tspan> LOTUS 需要金标 CoT；无 CoT 数据时           </tspan><tspan x="664.0" dy="19.9">如何让潜在轨迹可读、可审计，是安全层面的开放问题         </tspan><tspan x="664.0" dy="26.9">• <tspan font-weight="bold">layer-loop 的机制。</tspan> Loopie 三个理由中只有扩展性有实验；          </tspan><tspan x="664.0" dy="19.9">SMELT 的「第二次访问削弱注意力沉降」是唯一机制解释         </tspan><tspan x="664.0" dy="26.9">• <tspan font-weight="bold">循环 vs 序列长度扩展。</tspan> Hidden Decoding（WeLM 617B）走          </tspan><tspan x="664.0" dy="19.9">序列维度并称更兼容流水线并行；Loopie 的 layer-loop 恰为流水           </tspan><tspan x="664.0" dy="19.9">线兼容而设计；100B+ 上无正面对比      </tspan></text></g><g id="takeaway" data-pptx-bounds="64 492 1152 44"><rect x="64" y="492" width="1152" height="44" rx="4" fill="#4FC9E8" fill-opacity="0.08" /><rect x="64" y="491.8" width="3" height="44" fill="#4FC9E8" /><text x="80" y="514" font-size="14" fill="#E6EDF5"><tspan x="80" dy="0.0"><tspan font-weight="bold">最值得做的两个空白：</tspan>R≥4 的算力匹配扩展律；循环专用的 RL 目标（把 credit 分到潜在轨迹上）。                 </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   19</tspan></text></g></svg>
