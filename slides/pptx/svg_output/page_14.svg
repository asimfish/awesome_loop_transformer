<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" /><g id="title" data-pptx-bounds="64 40 1152 98" font-weight="bold"><text x="64" y="53" font-size="13" fill="#4FC9E8"><tspan x="64" dy="0.0">洞察 1–3   </tspan></text><text x="64" y="88" font-size="26" fill="#E6EDF5"><tspan x="64" dy="0.0">算力匹配的门已过、但门很窄；循环次数分裂成两个 regime；粒          </tspan><tspan x="64" dy="31.7">度向中间收敛   </tspan></text></g><g id="ins1" data-pptx-bounds="64 148 373 420"><rect x="64" y="148" width="373" height="420" rx="10" fill="#16283C" stroke="#4FC9E8" stroke-width="1.2" /><text x="80.0" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="80.0" dy="0.0">1 · 窄门里的首胜   </tspan></text><text x="80.0" y="198" font-size="13" fill="#E6EDF5"><tspan x="80.0" dy="0.0">Loopie 与 SMELT 第一次在匹配训练成本下       </tspan><tspan x="80.0" dy="18.5">赢，但配置极窄：MoE、layer-loop / 中段、       </tspan><tspan x="80.0" dy="18.5">两次。Schwethelm 的扩展律解释原因——一次       </tspan><tspan x="80.0" dy="18.5">循环只值 r^0.46 份独立参数（截断反传下       </tspan><tspan x="80.0" dy="18.5">0.38），用循环换参数在 FLOPs 匹配下必输       </tspan><tspan x="80.0" dy="18.5">；Loopie 是用循环省下的<tspan font-weight="bold">激活内存</tspan>换      </tspan><tspan x="80.0" dy="18.5">micro-batch 再换宽度，理论 FLOPs 看不见       </tspan><tspan x="80.0" dy="18.5">这笔红利。   </tspan></text></g><g id="ins2" data-pptx-bounds="453 148 373 420"><rect x="453" y="148" width="373" height="420" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="469.3333333333333" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="469.3333333333333" dy="0.0">2 · 两个 regime   </tspan></text><text x="469.3333333333333" y="198" font-size="13" fill="#E6EDF5"><tspan x="469.3333333333333" dy="0.0">最优循环数：Loopie 2 · LoopCoder-v2 2 ·       </tspan><tspan x="469.3333333333333" dy="18.5">SMELT 2 · Nanbeige 2 · Ouro 4 · Huginn       </tspan><tspan x="469.3333333333333" dy="18.5">32（可到 64）· RecurTrace 2.0 ·      </tspan><tspan x="469.3333333333333" dy="18.5">Think-at-Hard 在 93% token 上 1。分裂线       </tspan><tspan x="469.3333333333333" dy="18.5">是<tspan font-weight="bold">算力约束在哪</tspan>：预训练受限 → 2；推理可变       </tspan><tspan x="469.3333333333333" dy="18.5">→ 按需自适应（Huginn ARC-C 随 few-shot       </tspan><tspan x="469.3333333333333" dy="18.5">数从 8 次饱和到 32 次）。「三次以上回退」       </tspan><tspan x="469.3333333333333" dy="18.5">是 PLT 的位置税。   </tspan></text></g><g id="ins3" data-pptx-bounds="843 148 373 420"><rect x="843" y="148" width="373" height="420" rx="10" fill="#16283C" stroke="#4A7BA7" stroke-width="0.8" /><text x="858.6666666666666" y="177" font-size="15" fill="#4FC9E8" font-weight="bold"><tspan x="858.6666666666666" dy="0.0">3 · 粒度变细、位置居中    </tspan></text><text x="858.6666666666666" y="198" font-size="13" fill="#E6EDF5"><tspan x="858.6666666666666" dy="0.0">整模型（UT）→ 三段式（Huginn）→ 逐层 /       </tspan><tspan x="858.6666666666666" dy="18.5">中段（Loopie、Training-Free、SMELT）       </tspan><tspan x="858.6666666666666" dy="18.5">→ 只循环 mixer（MixerLoop 保留 41.5% 收       </tspan><tspan x="858.6666666666666" dy="18.5">益、省 45.9% FLOPs）。三条独立证据指向       </tspan><tspan x="858.6666666666666" dy="18.5">同一位置：深度分数规则 0.43–0.71（众数       </tspan><tspan x="858.6666666666666" dy="18.5">0.5）、SMELT 的「中间一半」、Huginn 的       </tspan><tspan x="858.6666666666666" dy="18.5">首尾层特化。MoE 必须 layer-loop，免训练       </tspan><tspan x="858.6666666666666" dy="18.5">与从头训练两篇独立一致。    </tspan></text></g><g id="footer" data-pptx-bounds="64 688 1152 22"><text x="64" y="700" font-size="10.5" fill="#A9B8CB"><tspan x="64" dy="0.0">Loopie 2607.16051 · SMELT 2609.01343 · Schwethelm 2604.21106 · MixerLoop 2608.18230 · Training-Free 2605.23872                      </tspan></text><text x="1216" y="701" font-size="11" fill="#4A7BA7" text-anchor="end"><tspan x="1216" dy="0.0">   14</tspan></text></g></svg>
