<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E3350" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1626"/>
      <stop offset="1" stop-color="#11233A"/>
    </linearGradient>
    <marker id="head" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#38BDF8"/>
    </marker>
    <marker id="headg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)" opacity="0.55"/>

  <!-- title block -->
  <text x="64" y="92" fill="#38BDF8" font-size="16" font-weight="600" letter-spacing="3">AWESOME LIST · SURVEY · REPORTS · SLIDES</text>
  <text x="64" y="150" fill="#F1F5F9" font-size="50" font-weight="700">Awesome Loop Transformer</text>
  <text x="64" y="196" fill="#CBD5E1" font-size="24">Looped Transformers · Recurrent Depth · Latent Reasoning</text>
  <text x="64" y="236" fill="#94A3B8" font-size="17">Same weights, more depth: from Universal Transformers (2018)</text>
  <text x="64" y="262" fill="#94A3B8" font-size="17">to compute-matched looped MoE models (2026).</text>
  <text x="64" y="316" fill="#64748B" font-size="15" font-family="'JetBrains Mono', Menlo, Consolas, monospace">github.com/asimfish/awesome_loop_transformer</text>

  <!-- schematic: prelude -> recurrent core x r -> coda -->
  <g transform="translate(940,64)">
    <rect x="0" y="176" width="128" height="44" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="64" y="204" fill="#CBD5E1" font-size="16" text-anchor="middle">prelude</text>
    <line x1="64" y1="176" x2="64" y2="150" stroke="#64748B" stroke-width="2" marker-end="url(#headg)"/>

    <rect x="-24" y="66" width="176" height="80" rx="10" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
    <text x="64" y="100" fill="#F0F9FF" font-size="19" font-weight="700" text-anchor="middle">recurrent core</text>
    <text x="64" y="126" fill="#7DD3FC" font-size="15" text-anchor="middle">shared weights</text>
    <path d="M152,124 C226,124 226,88 156,88" fill="none" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#head)"/>
    <text x="226" y="114" fill="#38BDF8" font-size="22" font-weight="700">× r</text>

    <line x1="64" y1="66" x2="64" y2="40" stroke="#64748B" stroke-width="2" marker-end="url(#headg)"/>
    <rect x="0" y="-8" width="128" height="44" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="64" y="20" fill="#CBD5E1" font-size="16" text-anchor="middle">coda</text>

    <text x="64" y="252" fill="#64748B" font-size="13" text-anchor="middle">depth = layers × loops · params unchanged</text>
  </g>
</svg>
