<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
<title id="title">Allocate more computation in latent space</title><desc id="desc">Recurrent-depth pretraining. More recurrence adds computation without adding a new parameter set at every step.</desc>
<rect width="1100" height="480" rx="12" fill="#f8f7f2"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17675d"/></marker></defs>
<g font-family="Verdana, sans-serif"><text x="38" y="38" font-size="12" letter-spacing="2" fill="#536b72">RECURRENT-DEPTH PRETRAINING</text>
<text x="38" y="80" font-size="29" fill="#182c33">Allocate more computation in latent space</text><rect x="38" y="110" width="492" height="185" rx="8" fill="#fffefa" stroke="#ced9d3"/><text x="60" y="147" font-size="20" fill="#17675d">Prelude and recurrent core</text><circle cx="63" cy="180" r="3" fill="#17675d"/><text x="78" y="185" font-size="15" fill="#435960">Encode the input before recurrent processing.</text><circle cx="63" cy="214" r="3" fill="#17675d"/><text x="78" y="219" font-size="15" fill="#435960">Reuse the core parameters across depth steps.</text><circle cx="63" cy="248" r="3" fill="#17675d"/><text x="78" y="253" font-size="15" fill="#435960">Carry the hidden state from one step to the next.</text><rect x="570" y="110" width="492" height="185" rx="8" fill="#fffefa" stroke="#ced9d3"/><text x="592" y="147" font-size="20" fill="#17675d">Coda and readout</text><circle cx="595" cy="180" r="3" fill="#17675d"/><text x="610" y="185" font-size="15" fill="#435960">Read out the recurrent state to predict tokens.</text><circle cx="595" cy="214" r="3" fill="#17675d"/><text x="610" y="219" font-size="15" fill="#435960">Choose the inference loop budget independently.</text><circle cx="595" cy="248" r="3" fill="#17675d"/><text x="610" y="253" font-size="15" fill="#435960">Compare accuracy, latency, and memory together.</text><rect x="70" y="332" width="280" height="65" rx="6" fill="#e7eee8"/><text x="210" y="372" text-anchor="middle" font-size="18" fill="#182c33">Prelude</text><path d="M358 364H400" stroke="#17675d" stroke-width="2" marker-end="url(#a)"/><rect x="410" y="332" width="280" height="65" rx="6" fill="#17675d"/><text x="550" y="372" text-anchor="middle" font-size="18" fill="#ffffff">Recurrent core</text><path d="M698 364H740" stroke="#17675d" stroke-width="2" marker-end="url(#a)"/><rect x="750" y="332" width="280" height="65" rx="6" fill="#e7eee8"/><text x="890" y="372" text-anchor="middle" font-size="18" fill="#182c33">Coda</text><text x="38" y="447" font-size="13" fill="#536b72">More recurrence adds computation without adding a new parameter set at every step.</text></g></svg>
