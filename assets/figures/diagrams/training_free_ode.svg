<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1F2A37"><rect width="900" height="300" fill="#FFFFFF"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0173B2"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#DE8F05"/></marker></defs><text x="24" y="30" font-size="17" fill="#1F2A37" text-anchor="start" font-weight="bold">Training-Free 的关键洞察：一层 = ODE 的一步欧拉，循环应细分步长而不是走到 t = K</text><text x="24" y="50" font-size="12" fill="#6B7280" text-anchor="start">pre-norm 层 L(x) = x + F(x) 就是 ẋ = F(x) 上步长 h = 1 的一步；后面的层只见过 t = 1 处的状态</text><line x1="60" y1="170" x2="840" y2="170" stroke="#6B7280" stroke-width="1.6" marker-end="url(#a)"/><text x="845" y="174" font-size="13" fill="#6B7280" text-anchor="start">t</text><line x1="180" y1="164" x2="180" y2="176" stroke="#6B7280"/><text x="180" y="192" font-size="12" fill="#6B7280" text-anchor="middle">t=0</text><line x1="380" y1="164" x2="380" y2="176" stroke="#6B7280"/><text x="380" y="192" font-size="12" fill="#6B7280" text-anchor="middle">t=1</text><line x1="580" y1="164" x2="580" y2="176" stroke="#6B7280"/><text x="580" y="192" font-size="12" fill="#6B7280" text-anchor="middle">t=2</text><line x1="780" y1="164" x2="780" y2="176" stroke="#6B7280"/><text x="780" y="192" font-size="12" fill="#6B7280" text-anchor="middle">t=3</text><rect x="352" y="98" width="56" height="66" rx="8" fill="#E6F4EE" stroke="#029E73" stroke-dasharray="4 3"/><text x="380" y="210" font-size="11" fill="#029E73" text-anchor="middle">后段层训练时只见过 t=1 附近的状态</text><line x1="186" y1="122" x2="372" y2="122" stroke="#DE8F05" stroke-width="2" marker-end="url(#ao)"/><circle cx="180" cy="122" r="5" fill="#DE8F05"/><line x1="386" y1="122" x2="572" y2="122" stroke="#DE8F05" stroke-width="2" marker-end="url(#ao)"/><circle cx="380" cy="122" r="5" fill="#DE8F05"/><line x1="586" y1="122" x2="772" y2="122" stroke="#DE8F05" stroke-width="2" marker-end="url(#ao)"/><circle cx="580" cy="122" r="5" fill="#DE8F05"/><circle cx="780" cy="122" r="5" fill="#DE8F05"/><text x="580" y="108" font-size="12" fill="#DE8F05" text-anchor="middle" font-weight="bold">朴素循环 K=3：三大步走到 t=3，后段层没见过 → 掉点</text><line x1="185.0" y1="156" x2="239.66666666666669" y2="156" stroke="#0173B2" stroke-width="2" marker-end="url(#ab)"/><circle cx="180.0" cy="156" r="4" fill="#0173B2"/><line x1="251.66666666666669" y1="156" x2="306.33333333333337" y2="156" stroke="#0173B2" stroke-width="2" marker-end="url(#ab)"/><circle cx="246.66666666666669" cy="156" r="4" fill="#0173B2"/><line x1="318.33333333333337" y1="156" x2="373.0" y2="156" stroke="#0173B2" stroke-width="2" marker-end="url(#ab)"/><circle cx="313.33333333333337" cy="156" r="4" fill="#0173B2"/><circle cx="380" cy="156" r="5" fill="#0173B2"/><text x="280.0" y="178" font-size="12" fill="#0173B2" text-anchor="middle" font-weight="bold">子步 K=3：三小步走到同一个 t=1，逼近更准</text><text x="60" y="240" font-size="12" fill="#1F2A37" text-anchor="start">阻尼欧拉：x ← (1 − 1/K)·x + (1/K)·g(x)，以 O(1/K) 逼近 x(t=1)；加锚点 β：输出 = β·g(x₀) + (1−β)·F^K(x₀)。</text><text x="60" y="260" font-size="12" fill="#1F2A37" text-anchor="start">2 维小网络：K=8 时朴素循环 MSE 335，子步 1.04。真实模型：中间 4 层、3 级 RK，45 个格子 87% 非负，MMLU-Pro 最多 +2.64。</text><text x="60" y="280" font-size="12" fill="#6B7280" text-anchor="start">配方边界：窗口 n=4 是甜点，n≥6 悬崖，循环整模型 −27.7；MoE 必须 layer-mode（否则路由抖动）。</text></svg>