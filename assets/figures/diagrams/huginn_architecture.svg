<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1F2A37"><rect width="900" height="390" fill="#FFFFFF"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0173B2"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#DE8F05"/></marker></defs><text x="24" y="30" font-size="17" fill="#1F2A37" text-anchor="start" font-weight="bold">Huginn-3.5B 的三段式循环深度（Geiping et al. 2025）</text><text x="24" y="50" font-size="12" fill="#6B7280" text-anchor="start">Prelude 嵌入 → Core 重复 r 次（每步重新注入 e）→ Coda 解码；训练时 r 随机，只对最后 8 步反传</text><rect x="40" y="80" width="130" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="105.0" y="113.0" text-anchor="middle" font-size="14" fill="#1F2A37">输入 token x</text><line x1="170" y1="108" x2="210" y2="108" stroke="#6B7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="212" y="80" width="150" height="56" rx="8" fill="#E0ECF7" stroke="#0173B2" stroke-width="1.2"/><text x="287.0" y="107.0" text-anchor="middle" font-size="14" fill="#1F2A37" font-weight="bold">Prelude P</text><text x="287.0" y="121.0" text-anchor="middle" font-size="11" fill="#6B7280">2 层 · 嵌入 e</text><line x1="362" y1="108" x2="402" y2="108" stroke="#6B7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="404" y="58" width="230" height="100" rx="10" fill="#E6F4EE" stroke="#029E73" stroke-width="1.5"/><rect x="424" y="80" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#029E73" stroke-width="1.2"/><text x="519.0" y="107.0" text-anchor="middle" font-size="14" fill="#1F2A37" font-weight="bold">Core R</text><text x="519.0" y="121.0" text-anchor="middle" font-size="11" fill="#6B7280">4 层 · sᵢ = R(e, sᵢ₋₁)</text><text x="519" y="72" font-size="11" fill="#029E73" text-anchor="middle" font-weight="bold">× r（训练时随机，均值 32；测试时任选）</text><path d="M614,88 C660,50 380,50 424,88" fill="none" stroke="#029E73" stroke-width="1.6" marker-end="url(#a)"/><line x1="287" y1="136" x2="287" y2="180" stroke="#0173B2" stroke-width="1.6" marker-end="url(#ab)"/><path d="M287,180 L424,180 L424,136" fill="none" stroke="#0173B2" stroke-width="1.6" marker-end="url(#ab)"/><text x="300" y="196" font-size="11" fill="#0173B2" text-anchor="start">每一步都重新注入 e（输入注入）</text><line x1="634" y1="108" x2="674" y2="108" stroke="#6B7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="676" y="80" width="150" height="56" rx="8" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.2"/><text x="751.0" y="107.0" text-anchor="middle" font-size="14" fill="#1F2A37" font-weight="bold">Coda C</text><text x="751.0" y="121.0" text-anchor="middle" font-size="11" fill="#6B7280">2 层 · 解码到词表</text><text x="40" y="230" font-size="12" fill="#1F2A37" text-anchor="start">s₀ 是随机噪声；有效深度 2 + 4r + 2，r = 32 时 132 层，但参数只有 3.5B。</text><text x="40" y="250" font-size="12" fill="#1F2A37" text-anchor="start">训练：r ~ 对数正态泊松（重尾）；只对最后 k = 8 步反向传播 → 显存与 r 无关。三明治归一化 + 小学习率避免两种坍缩。</text><text x="40" y="280" font-size="12" fill="#1F2A37" text-anchor="start" font-weight="bold">测试时多循环 = 多算力：ARC-E 随 r 上升（Table 1）</text><rect x="100" y="292" width="126.98" height="14" fill="#93C5FD"/><text x="40" y="304" font-size="11" fill="#6B7280" text-anchor="start">r=4</text><text x="232.98000000000002" y="304" font-size="11" fill="#1F2A37" text-anchor="start">49.07</text><rect x="100" y="314" width="351.53999999999996" height="14" fill="#93C5FD"/><text x="40" y="326" font-size="11" fill="#6B7280" text-anchor="start">r=8</text><text x="457.53999999999996" y="326" font-size="11" fill="#1F2A37" text-anchor="start">65.11</text><rect x="100" y="336" width="412.8599999999999" height="14" fill="#93C5FD"/><text x="40" y="348" font-size="11" fill="#6B7280" text-anchor="start">r=16</text><text x="518.8599999999999" y="348" font-size="11" fill="#1F2A37" text-anchor="start">69.49</text><rect x="100" y="358" width="418.73999999999995" height="14" fill="#0173B2"/><text x="40" y="370" font-size="11" fill="#6B7280" text-anchor="start">r=32</text><text x="524.74" y="370" font-size="11" fill="#1F2A37" text-anchor="start">69.91</text><text x="560" y="310" font-size="12" fill="#DE8F05" text-anchor="start" font-weight="bold">公平对照要看同为 0.18T token 的 Table 4：</text><text x="560" y="330" font-size="12" fill="#1F2A37" text-anchor="start">ARC-E 46.42 → 53.62，GSM8K CoT 2.20 → 10.24。</text><text x="560" y="350" font-size="12" fill="#6B7280" text-anchor="start">「0.8T 循环模型 vs 0.18T 基线」的对比夸大了差距。</text></svg>