<svg xmlns="http://www.w3.org/2000/svg" width="900" height="366" viewBox="0 0 900 366" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1F2A37"><rect width="900" height="366" fill="#FFFFFF"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0173B2"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#DE8F05"/></marker></defs><text x="24" y="30" font-size="17" fill="#1F2A37" text-anchor="start" font-weight="bold">三种循环粒度：同一组参数如何被重复使用</text><text x="24" y="50" font-size="12" fill="#6B7280" text-anchor="start">model-loop 整栈循环 · block-loop 只循环中段 · layer-loop 每层各自循环</text><text x="24" y="90" font-size="14" fill="#1F2A37" text-anchor="start" font-weight="bold">model-loop（整模型循环）</text><text x="24" y="108" font-size="11" fill="#6B7280" text-anchor="start">UT 2018 · Huginn 核心块 · Ouro</text><rect x="330" y="72" width="64" height="34" rx="6" fill="#0173B2" stroke="#0173B2" stroke-width="1.2"/><text x="362.0" y="94.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L1</text><rect x="404" y="72" width="64" height="34" rx="6" fill="#0173B2" stroke="#0173B2" stroke-width="1.2"/><text x="436.0" y="94.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L2</text><rect x="478" y="72" width="64" height="34" rx="6" fill="#0173B2" stroke="#0173B2" stroke-width="1.2"/><text x="510.0" y="94.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L3</text><rect x="552" y="72" width="64" height="34" rx="6" fill="#0173B2" stroke="#0173B2" stroke-width="1.2"/><text x="584.0" y="94.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L1</text><rect x="626" y="72" width="64" height="34" rx="6" fill="#0173B2" stroke="#0173B2" stroke-width="1.2"/><text x="658.0" y="94.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L2</text><rect x="700" y="72" width="64" height="34" rx="6" fill="#0173B2" stroke="#0173B2" stroke-width="1.2"/><text x="732.0" y="94.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L3</text><text x="330" y="128" font-size="12" fill="#6B7280" text-anchor="start">整栈输出再喂回：L1→L2→L3→L1→L2→L3</text><text x="24" y="180" font-size="14" fill="#1F2A37" text-anchor="start" font-weight="bold">block-loop（块循环）</text><text x="24" y="198" font-size="11" fill="#6B7280" text-anchor="start">Huginn 三段式 · Hyperloop · Training-Free · SMELT</text><rect x="330" y="162" width="64" height="34" rx="6" fill="#CBD5E1" stroke="#CBD5E1" stroke-width="1.2"/><text x="362.0" y="184.0" text-anchor="middle" font-size="13" fill="#1F2A37">首层</text><rect x="404" y="162" width="64" height="34" rx="6" fill="#0173B2" stroke="#0173B2" stroke-width="1.2"/><text x="436.0" y="184.0" text-anchor="middle" font-size="13" fill="#FFFFFF">中段</text><rect x="478" y="162" width="64" height="34" rx="6" fill="#0173B2" stroke="#0173B2" stroke-width="1.2"/><text x="510.0" y="184.0" text-anchor="middle" font-size="13" fill="#FFFFFF">中段</text><rect x="552" y="162" width="64" height="34" rx="6" fill="#0173B2" stroke="#0173B2" stroke-width="1.2"/><text x="584.0" y="184.0" text-anchor="middle" font-size="13" fill="#FFFFFF">中段</text><rect x="626" y="162" width="64" height="34" rx="6" fill="#CBD5E1" stroke="#CBD5E1" stroke-width="1.2"/><text x="658.0" y="184.0" text-anchor="middle" font-size="13" fill="#1F2A37">尾层</text><text x="330" y="218" font-size="12" fill="#6B7280" text-anchor="start">首尾层只走一次，中段重复；每步重新注入输入 e</text><text x="24" y="270" font-size="14" fill="#1F2A37" text-anchor="start" font-weight="bold">layer-loop（逐层循环）</text><text x="24" y="288" font-size="11" fill="#6B7280" text-anchor="start">Loopie · Training-Free layer-mode · MixerLoop</text><rect x="330" y="252" width="64" height="34" rx="6" fill="#0173B2" stroke="#0173B2" stroke-width="1.2"/><text x="362.0" y="274.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L1</text><rect x="404" y="252" width="64" height="34" rx="6" fill="#7FB3D5" stroke="#7FB3D5" stroke-width="1.2"/><text x="436.0" y="274.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L1</text><rect x="478" y="252" width="64" height="34" rx="6" fill="#029E73" stroke="#029E73" stroke-width="1.2"/><text x="510.0" y="274.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L2</text><rect x="552" y="252" width="64" height="34" rx="6" fill="#7FD1B9" stroke="#7FD1B9" stroke-width="1.2"/><text x="584.0" y="274.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L2</text><rect x="626" y="252" width="64" height="34" rx="6" fill="#DE8F05" stroke="#DE8F05" stroke-width="1.2"/><text x="658.0" y="274.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L3</text><rect x="700" y="252" width="64" height="34" rx="6" fill="#F0BC6A" stroke="#F0BC6A" stroke-width="1.2"/><text x="732.0" y="274.0" text-anchor="middle" font-size="13" fill="#FFFFFF">L3</text><text x="330" y="308" font-size="12" fill="#6B7280" text-anchor="start">每层先自己重复两次再下传：L1→L1→L2→L2→L3→L3</text><text x="24" y="350" font-size="12" fill="#1F2A37" text-anchor="start">共同点：有效深度 = 存储层数 × 循环次数，参数量不变。三条独立证据都指向「循环中段、避开首尾层」（相对深度约 0.5）。</text></svg>