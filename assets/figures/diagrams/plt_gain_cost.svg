<svg xmlns="http://www.w3.org/2000/svg" width="900" height="346" viewBox="0 0 900 346" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1F2A37"><rect width="900" height="346" fill="#FFFFFF"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0173B2"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#DE8F05"/></marker></defs><text x="24" y="30" font-size="17" fill="#1F2A37" text-anchor="start" font-weight="bold">LoopCoder-v2：并行循环 Transformer 为什么在第 2 次循环就饱和</text><text x="24" y="50" font-size="12" fill="#6B7280" text-anchor="start">左：PLT 把上一轮状态右移一位后并行执行；右：收益递减、位置税不变 → R=2 达峰</text><text x="40" y="78" font-size="13" fill="#1F2A37" text-anchor="start" font-weight="bold">顺序循环</text><text x="130" y="78" font-size="11" fill="#6B7280" text-anchor="start">R 次串行，延迟与 KV 都 ×R</text><rect x="40" y="88" width="84" height="30" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/><text x="82.0" y="108.0" text-anchor="middle" font-size="12" fill="#1F2A37">第 1 轮</text><line x1="124" y1="103" x2="132" y2="103" stroke="#6B7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="132" y="88" width="84" height="30" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/><text x="174.0" y="108.0" text-anchor="middle" font-size="12" fill="#1F2A37">第 2 轮</text><line x1="216" y1="103" x2="224" y2="103" stroke="#6B7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="224" y="88" width="84" height="30" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/><text x="266.0" y="108.0" text-anchor="middle" font-size="12" fill="#1F2A37">第 3 轮</text><text x="40" y="148" font-size="13" fill="#1F2A37" text-anchor="start" font-weight="bold">PLT（跨循环位置偏移 CLP）</text><text x="240" y="148" font-size="11" fill="#6B7280" text-anchor="start">一次前向内并行，延迟 ≈ 单次</text><rect x="40" y="160" width="54" height="26" rx="4" fill="#E0ECF7" stroke="#0173B2" stroke-width="1.2"/><text x="67.0" y="178.0" text-anchor="middle" font-size="11" fill="#1F2A37">x₁ 轮1</text><rect x="102" y="160" width="54" height="26" rx="4" fill="#E0ECF7" stroke="#0173B2" stroke-width="1.2"/><text x="129.0" y="178.0" text-anchor="middle" font-size="11" fill="#1F2A37">x₂ 轮1</text><rect x="102" y="192" width="54" height="26" rx="4" fill="#E6F4EE" stroke="#029E73" stroke-width="1.2"/><text x="129.0" y="210.0" text-anchor="middle" font-size="11" fill="#1F2A37">x₂ 轮2</text><line x1="67" y1="186" x2="124" y2="194" stroke="#029E73" stroke-width="1.4" marker-end="url(#a)"/><rect x="164" y="160" width="54" height="26" rx="4" fill="#E0ECF7" stroke="#0173B2" stroke-width="1.2"/><text x="191.0" y="178.0" text-anchor="middle" font-size="11" fill="#1F2A37">x₃ 轮1</text><rect x="164" y="192" width="54" height="26" rx="4" fill="#E6F4EE" stroke="#029E73" stroke-width="1.2"/><text x="191.0" y="210.0" text-anchor="middle" font-size="11" fill="#1F2A37">x₃ 轮2</text><line x1="129" y1="186" x2="186" y2="194" stroke="#029E73" stroke-width="1.4" marker-end="url(#a)"/><rect x="226" y="160" width="54" height="26" rx="4" fill="#E0ECF7" stroke="#0173B2" stroke-width="1.2"/><text x="253.0" y="178.0" text-anchor="middle" font-size="11" fill="#1F2A37">x₄ 轮1</text><rect x="226" y="192" width="54" height="26" rx="4" fill="#E6F4EE" stroke="#029E73" stroke-width="1.2"/><text x="253.0" y="210.0" text-anchor="middle" font-size="11" fill="#1F2A37">x₄ 轮2</text><line x1="191" y1="186" x2="248" y2="194" stroke="#029E73" stroke-width="1.4" marker-end="url(#a)"/><text x="40" y="238" font-size="11" fill="#DE8F05" text-anchor="start">第 2 轮的 xᵢ 拿到的是邻居 xᵢ₋₁ 的第 1 轮状态：位置错配，</text><text x="40" y="254" font-size="11" fill="#DE8F05" text-anchor="start">这是标准循环没有、PLT 每轮都要交的固定「位置税」Ω。</text><line x1="520" y1="228" x2="860" y2="228" stroke="#6B7280"/><line x1="520" y1="78" x2="520" y2="228" stroke="#6B7280"/><text x="580" y="244" font-size="12" fill="#6B7280" text-anchor="middle">R=2</text><text x="690" y="244" font-size="12" fill="#6B7280" text-anchor="middle">R=3</text><text x="800" y="244" font-size="12" fill="#6B7280" text-anchor="middle">R=4</text><polyline points="580,108 690,188 800,203" fill="none" stroke="#0173B2" stroke-width="2.5"/><circle cx="580" cy="108" r="4" fill="#0173B2"/><circle cx="690" cy="188" r="4" fill="#0173B2"/><circle cx="800" cy="203" r="4" fill="#0173B2"/><line x1="560" y1="138" x2="820" y2="136" stroke="#DE8F05" stroke-width="2.5" stroke-dasharray="6 4"/><text x="720" y="128" font-size="11" fill="#DE8F05" text-anchor="start">偏移成本 Ω ≈ 常数（固定位置税）</text><text x="584" y="100" font-size="11" fill="#0173B2" text-anchor="start">有效精化收益</text><text x="520" y="70" font-size="12" fill="#1F2A37" text-anchor="start" font-weight="bold">每多一次循环：收益 vs 成本（示意，非实测曲线）</text><text x="520" y="268" font-size="11" fill="#1F2A37" text-anchor="start">实测：有效秩 174.6 → 172.5 → 158.2；更新方向震荡（cos θ&lt;0）；</text><text x="520" y="284" font-size="11" fill="#1F2A37" text-anchor="start">第 3 轮起 Ω 是边际收益的 30–45 倍。</text><text x="520" y="300" font-size="11" fill="#1F2A37" text-anchor="start">SWE-bench Verified：43.0 → 64.4 → 27.6 → 22.4。</text><text x="40" y="310" font-size="12" fill="#6B7280" text-anchor="start">边界：非单调是 PLT 特有；顺序循环的 Huginn 到 r=32 单调上升。</text><text x="40" y="328" font-size="12" fill="#6B7280" text-anchor="start">R=2 上叠加显式 CoT 是超加的（LiveCodeBench +26.9）。</text></svg>