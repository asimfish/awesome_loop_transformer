<svg xmlns="http://www.w3.org/2000/svg" width="900" height="306" viewBox="0 0 900 306" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1F2A37"><rect width="900" height="306" fill="#FFFFFF"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0173B2"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#DE8F05"/></marker></defs><text x="24" y="30" font-size="17" fill="#1F2A37" text-anchor="start" font-weight="bold">Loopie Recipe：把循环省下的显存换成宽度，再按实测步时匹配算力</text><text x="24" y="50" font-size="12" fill="#6B7280" text-anchor="start">Loop the Loopies!（2026-07）：layer-loop · 两次循环 · MoE 骨干</text><rect x="24" y="80" width="200" height="120" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.4"/><text x="36" y="102" font-size="12" fill="#CBD5E1" text-anchor="start" font-weight="bold">参考模型</text><text x="36" y="124" font-size="14" fill="#1F2A37" text-anchor="start" font-weight="bold">Qwen3-like 30B-A3B</text><text x="36" y="148" font-size="11" fill="#6B7280" text-anchor="start">D=2048 · L=48 · R=1</text><line x1="224" y1="140" x2="240" y2="140" stroke="#6B7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="242" y="80" width="200" height="120" rx="10" fill="#E0ECF7" stroke="#0173B2" stroke-width="1.4"/><text x="254" y="102" font-size="12" fill="#0173B2" text-anchor="start" font-weight="bold">① 层数减半、循环两次</text><text x="254" y="124" font-size="14" fill="#1F2A37" text-anchor="start" font-weight="bold">种子 Loopie</text><text x="254" y="148" font-size="11" fill="#6B7280" text-anchor="start">D=2048 · L=24 · R=2</text><text x="254" y="166" font-size="11" fill="#6B7280" text-anchor="start">块执行次数不变，激活内存 ×0.5</text><line x1="442" y1="140" x2="458" y2="140" stroke="#6B7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="460" y="80" width="200" height="120" rx="10" fill="#E6F4EE" stroke="#029E73" stroke-width="1.4"/><text x="472" y="102" font-size="12" fill="#029E73" text-anchor="start" font-weight="bold">② 显存换吞吐</text><text x="472" y="124" font-size="14" fill="#1F2A37" text-anchor="start" font-weight="bold">每卡 micro-batch ×2</text><text x="472" y="148" font-size="11" fill="#6B7280" text-anchor="start">梯度累积 ÷2，每步 token 不变</text><text x="472" y="166" font-size="11" fill="#6B7280" text-anchor="start">实测每步更快</text><line x1="660" y1="140" x2="676" y2="140" stroke="#6B7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="678" y="80" width="200" height="120" rx="10" fill="#FDF1E1" stroke="#DE8F05" stroke-width="1.4"/><text x="690" y="102" font-size="12" fill="#DE8F05" text-anchor="start" font-weight="bold">③ 再投资到容量</text><text x="690" y="124" font-size="14" fill="#1F2A37" text-anchor="start" font-weight="bold">Loopie-20B-A2B</text><text x="690" y="148" font-size="11" fill="#6B7280" text-anchor="start">D=2304 · L=27 · R=2</text><text x="690" y="166" font-size="11" fill="#6B7280" text-anchor="start">名义算力 1.42×，步时 ≈ 参考</text><text x="24" y="230" font-size="13" fill="#1F2A37" text-anchor="start" font-weight="bold">为什么是 layer-loop：</text><rect x="190" y="212" width="46" height="28" rx="5" fill="#0173B2" stroke="#0173B2" stroke-width="1.2"/><text x="213.0" y="231.0" text-anchor="middle" font-size="12" fill="#FFFFFF">L1</text><rect x="244" y="212" width="46" height="28" rx="5" fill="#7FB3D5" stroke="#7FB3D5" stroke-width="1.2"/><text x="267.0" y="231.0" text-anchor="middle" font-size="12" fill="#FFFFFF">L1</text><rect x="298" y="212" width="46" height="28" rx="5" fill="#029E73" stroke="#029E73" stroke-width="1.2"/><text x="321.0" y="231.0" text-anchor="middle" font-size="12" fill="#FFFFFF">L2</text><rect x="352" y="212" width="46" height="28" rx="5" fill="#7FD1B9" stroke="#7FD1B9" stroke-width="1.2"/><text x="375.0" y="231.0" text-anchor="middle" font-size="12" fill="#FFFFFF">L2</text><rect x="406" y="212" width="46" height="28" rx="5" fill="#DE8F05" stroke="#DE8F05" stroke-width="1.2"/><text x="429.0" y="231.0" text-anchor="middle" font-size="12" fill="#FFFFFF">L3</text><rect x="460" y="212" width="46" height="28" rx="5" fill="#F0BC6A" stroke="#F0BC6A" stroke-width="1.2"/><text x="483.0" y="231.0" text-anchor="middle" font-size="12" fill="#FFFFFF">L3</text><text x="520" y="224" font-size="11" fill="#6B7280" text-anchor="start">每层的所有循环都在同一流水线 stage 内完成；</text><text x="520" y="240" font-size="11" fill="#6B7280" text-anchor="start">6B 模型上约 1.2T token 后反超 model-loop。</text><text x="24" y="264" font-size="12" fill="#1F2A37" text-anchor="start">结果：与参考模型同预算训练 800B token，约 600B 后反超并保持；4 级扩展梯全胜。20B-A2B Thinking：MMLU 81.28、AIME24 92.09（3.5T token）。</text><text x="24" y="284" font-size="12" fill="#DE8F05" text-anchor="start">口径：匹配的是实测优化器步时，不是 FLOPs（名义高 42%）；推理时每 token 54 次块计算 vs 48，推理延迟未报告。</text></svg>