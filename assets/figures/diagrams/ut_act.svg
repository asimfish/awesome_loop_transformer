<svg xmlns="http://www.w3.org/2000/svg" width="900" height="358" viewBox="0 0 900 358" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1F2A37"><rect width="900" height="358" fill="#FFFFFF"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0173B2"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#DE8F05"/></marker></defs><text x="24" y="30" font-size="17" fill="#1F2A37" text-anchor="start" font-weight="bold">Universal Transformer（2018）：同一个块在时间步上重复，每个位置自己决定停在哪一步</text><text x="24" y="50" font-size="12" fill="#6B7280" text-anchor="start">每步 = 自注意力（跨位置交换信息）+ 位置无关的转移函数；ACT 让不同 token 有不同的「思考深度」</text><text x="120" y="72" font-size="12" fill="#6B7280" text-anchor="middle">t=1</text><text x="250" y="72" font-size="12" fill="#6B7280" text-anchor="middle">t=2</text><text x="380" y="72" font-size="12" fill="#6B7280" text-anchor="middle">t=3</text><text x="510" y="72" font-size="12" fill="#6B7280" text-anchor="middle">t=4</text><text x="640" y="72" font-size="12" fill="#6B7280" text-anchor="middle">t=5</text><text x="50" y="106" font-size="12" fill="#1F2A37" text-anchor="end">The</text><rect x="75" y="90" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="120" y="105" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="205" y="90" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="250" y="105" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="335" y="90" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="380" y="105" font-size="9" fill="#6B7280" text-anchor="middle">已停机（复制状态）</text><rect x="465" y="90" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><rect x="595" y="90" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="50" y="138" font-size="12" fill="#1F2A37" text-anchor="end">keys</text><rect x="75" y="122" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="120" y="137" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="205" y="122" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="250" y="137" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="335" y="122" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="380" y="137" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="465" y="122" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="510" y="137" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="595" y="122" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="640" y="137" font-size="9" fill="#6B7280" text-anchor="middle">已停机（复制状态）</text><text x="50" y="170" font-size="12" fill="#1F2A37" text-anchor="end">to</text><rect x="75" y="154" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="120" y="169" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="205" y="154" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="250" y="169" font-size="9" fill="#6B7280" text-anchor="middle">已停机（复制状态）</text><rect x="335" y="154" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><rect x="465" y="154" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><rect x="595" y="154" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="50" y="202" font-size="12" fill="#1F2A37" text-anchor="end">the</text><rect x="75" y="186" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="120" y="201" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="205" y="186" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="250" y="201" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="335" y="186" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="380" y="201" font-size="9" fill="#6B7280" text-anchor="middle">已停机（复制状态）</text><rect x="465" y="186" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><rect x="595" y="186" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="50" y="234" font-size="12" fill="#1F2A37" text-anchor="end">cabinet</text><rect x="75" y="218" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="120" y="233" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="205" y="218" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="250" y="233" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="335" y="218" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="380" y="233" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="465" y="218" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="510" y="233" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="595" y="218" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="640" y="233" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><text x="50" y="266" font-size="12" fill="#1F2A37" text-anchor="end">are</text><rect x="75" y="250" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="120" y="265" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="205" y="250" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="250" y="265" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="335" y="250" width="90" height="22" rx="5" fill="#E0ECF7" stroke="#0173B2" stroke-dasharray=""/><text x="380" y="265" font-size="10" fill="#0173B2" text-anchor="middle">共享块</text><rect x="465" y="250" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="510" y="265" font-size="9" fill="#6B7280" text-anchor="middle">已停机（复制状态）</text><rect x="595" y="250" width="90" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/><text x="730" y="190" font-size="12" fill="#1F2A37" text-anchor="start">→ 输出</text><text x="50" y="298" font-size="12" fill="#1F2A37" text-anchor="start">同一列内所有位置通过自注意力互相看见上一时刻的状态（RNN 做不到这一点）；参数跨 t 共享，加坐标嵌入 P^t 告知当前步数。</text><text x="50" y="318" font-size="12" fill="#1F2A37" text-anchor="start">ACT 实证：需要 1 / 2 / 3 条支撑事实的问题平均想 2.3 / 3.1 / 3.8 步。bAbI 联合训练错误率 22.1 → 0.29；LAMBADA 困惑度 7321 → 142。</text><text x="50" y="338" font-size="12" fill="#6B7280" text-anchor="start">留下三个问题：参数—计算比（翻译只 +0.9 BLEU）、训练不稳定、推理成本——正是之后八年的研究议程。</text></svg>