<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1F2A37"><rect width="900" height="330" fill="#FFFFFF"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0173B2"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#DE8F05"/></marker></defs><text x="24" y="30" font-size="17" fill="#1F2A37" text-anchor="start" font-weight="bold">「循环几次」分裂成两个 regime：取决于算力约束在哪里</text><text x="24" y="50" font-size="12" fill="#6B7280" text-anchor="start">洞察 2：预训练预算固定 → 2 次；推理算力可变 → 越多越好、但要自适应</text><rect x="24" y="80" width="410" height="200" rx="12" fill="#E0ECF7" stroke="#0173B2" stroke-width="1.5"/><text x="44" y="108" font-size="14" fill="#0173B2" text-anchor="start" font-weight="bold">预训练算力受限（前沿模型训练）</text><text x="44" y="138" font-size="12" fill="#1F2A37" text-anchor="start">• 每多一次循环 = 训练 FLOPs 乘一个系数</text><text x="44" y="164" font-size="12" fill="#1F2A37" text-anchor="start">• 边际收益在 R=2 后衰减最快（Loopie Fig. 6）</text><text x="44" y="190" font-size="12" fill="#1F2A37" text-anchor="start">• Loopie 2 · LoopCoder-v2 2 · SMELT 2 · Nanbeige4.2 2</text><text x="44" y="216" font-size="12" fill="#0173B2" text-anchor="start" font-weight="bold">→ 答案：R = 2，用省下的显存买宽度</text><rect x="466" y="80" width="410" height="200" rx="12" fill="#E6F4EE" stroke="#029E73" stroke-width="1.5"/><text x="486" y="108" font-size="14" fill="#029E73" text-anchor="start" font-weight="bold">推理算力可变（同一个模型、按题分配）</text><text x="486" y="138" font-size="12" fill="#1F2A37" text-anchor="start">• Huginn：ARC-C 零样本 8 次饱和，25–50 shot 需 32 次</text><text x="486" y="164" font-size="12" fill="#1F2A37" text-anchor="start">• Ouro 4 · Huginn 32–64 · RecurTrace 平均 2.0 · TaH 93% token 只 1 次</text><text x="486" y="190" font-size="12" fill="#1F2A37" text-anchor="start">• 自适应停机：KL 阈值 / 步长二阶差 / 学习式停机头</text><text x="486" y="216" font-size="12" fill="#029E73" text-anchor="start" font-weight="bold">→ 答案：按需、自适应，越难想越久</text><text x="24" y="310" font-size="12" fill="#DE8F05" text-anchor="start">常见误读：「循环两次就够，三次以上回退」——那是并行循环（PLT）的位置税，不是循环深度的普适上限；顺序循环的 Huginn 到 r=32 单调上升。</text></svg>